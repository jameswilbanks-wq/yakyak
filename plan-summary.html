<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YakYak — Plan complete</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="lesson-wrap">
    <div id="summaryBody"></div>
  </div>

  <script src="supabase-client.js"></script>
  <script src="i18n.js"></script>
  <script>
    const MODULE_INFO = {
      vocab: { icon: 'books', nameKey: 'db.vocabChip' },
      translate: { icon: 'letters', nameKey: 'db.translateDiagnose' },
      roleplay: { icon: 'speak', nameKey: 'db.naturalDialogChip' },
      input: { icon: 'book', nameKey: 'db.listenRead' },
    };

    function renderSummary(profile, plan) {
      const steps = plan.steps || [];
      document.getElementById('summaryBody').innerHTML = `
        <div class="lesson-center" style="padding-top:40px;">
          <div style="color:var(--mint);">${icon('confetti', { size: 44 })}</div>
          <h2 style="font-size:26px;margin:14px 0 4px;">${t('pl.summaryTitle')}</h2>
          <p class="text-dim" style="font-size:15px;">${t('pl.summaryXp', { xp: plan.totalXp || 0 })}</p>
          <div class="card" style="margin-top:22px;text-align:left;max-width:360px;width:100%;">
            <span class="label">${t('pl.summaryStepsRecap')}</span>
            <div style="display:flex;flex-direction:column;gap:8px;margin-top:8px;">
              ${steps.map(s => {
                const info = MODULE_INFO[s.module] || { icon: 'sparkle', nameKey: '' };
                return `<div style="display:flex;align-items:center;gap:10px;color:var(--accent-ink);">
                  <span>${icon(info.icon, { size: 16 })}</span>
                  <span style="flex:1;font-size:13.5px;color:var(--text);">${info.nameKey ? t(info.nameKey) : s.module}</span>
                  <span class="chip-mini">${s.minutes} min</span>
                </div>`;
              }).join('')}
            </div>
          </div>
          <button class="btn-primary" id="doneBtn" style="margin-top:24px;">${t('pl.backToDashboard')}</button>
        </div>`;
      document.getElementById('doneBtn').addEventListener('click', () => {
        clearActivePlan();
        window.location.href = 'dashboard.html';
      });
    }

    (async () => {
      const user = await requireAuth();
      if (!user) return;
      const profile = await getProfile(user.id);
      if (!profile || !profile.name) { window.location.href = 'onboarding.html'; return; }
      setLocale(profile.native_language);

      const plan = getActivePlan();
      if (!plan) {
        // No plan in session (e.g. direct visit or already cleared) —
        // nothing to summarize, just send them back home.
        window.location.href = 'dashboard.html';
        return;
      }
      renderSummary(profile, plan);
    })();
  </script>
</body>
</html>
