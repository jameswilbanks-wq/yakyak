<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YakYak — Translate</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="lesson-wrap">
    <div class="lesson-top">
      <button class="icon-btn" id="exitBtn">✕</button>
      <span class="text-faint" id="progressLabel" style="font-size:12.5px;"></span>
    </div>
    <div id="translateBody"></div>
  </div>

  <script src="supabase-client.js"></script>
  <script src="i18n.js"></script>
  <script>
    let user = null, profile = null, exercises = [], attempts = [], sessionTopic = null;
    let idx = 0, submitted = false;
    let planCtx = null; // { plan, step } if running as a lesson-plan step, else null

    function planStepPrefix() {
      if (!planCtx) return '';
      return t('pl.stepOfTotal', { i: planCtx.plan.currentIndex + 1, n: planCtx.plan.steps.length });
    }

    function renderLoading() {
      document.getElementById('translateBody').innerHTML = `
        <div class="lesson-center">
          <div id="mascotSlot" style="width:52px;"></div>
          <p class="text-dim" style="margin-top:16px;font-size:14.5px;">${t('tr.buildingSet')}</p>
        </div>`;
      document.getElementById('mascotSlot').innerHTML = mascotHTML(52);
    }

    function renderError(message) {
      document.getElementById('translateBody').innerHTML = `
        <div class="lesson-center error-box">
          <div style="font-size:30px;">⚠️</div>
          <p style="font-weight:700;">${t('tr.couldntBuild')}</p>
          <p class="text-faint" style="font-size:12.5px;max-width:320px;">${message}</p>
          <button class="btn-primary" id="retryBtn" style="margin-top:8px;">${t('ls.tryAgain')}</button>
        </div>`;
      document.getElementById('retryBtn').addEventListener('click', loadSet);
    }

    async function loadSet() {
      renderLoading();
      try {
        const avoid = await fetchRecentValues('translation_exercises', 'source_text', profile.target_language, profile.current_level, 10);
        const token = await getAuthToken();
        const count = planCtx ? Math.min(Math.max(Math.round(planCtx.step.minutes / 15 * 6), 3), 10) : undefined;
        const res = await fetch(TRANSLATE_GENERATE_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body: JSON.stringify({
            targetLanguage: langByCode(profile.target_language).name,
            nativeLanguage: profile.native_language,
            level: profile.current_level,
            interest: sessionTopic || 'daily life',
            angle: randomAngle(),
            avoid,
            ...(count ? { count } : {}),
          }),
        });
        const raw = await res.text();
        if (!raw) throw new Error('Empty response (HTTP ' + res.status + ')');
        const data = JSON.parse(raw);
        if (!res.ok || data.error) throw new Error(data.error || ('HTTP ' + res.status));
        if (!data.exercises || !data.exercises.length) throw new Error('No exercises returned');

        // Resolve each exercise's grammar point against the shared catalog
        // (upsert by code) and cache the exercise row itself, so later
        // weakness tracking (skill_mastery) has something stable to point
        // at instead of loose text.
        exercises = [];
        for (const ex of data.exercises) {
          const { data: gp } = await db.from('grammar_points')
            .upsert({
              target_language: profile.target_language,
              code: ex.grammarCode,
              label: ex.grammarLabel,
              level: profile.current_level,
              description: ex.grammarDescription,
            }, { onConflict: 'target_language,code' })
            .select('id')
            .single();

          const { data: row } = await db.from('translation_exercises').insert({
            target_language: profile.target_language,
            native_language: profile.native_language,
            level: profile.current_level,
            source_text: ex.sourceText,
            source_lang: ex.sourceLang,
            expected_text: ex.expectedText,
            grammar_point_id: gp ? gp.id : null,
            interest_tag: sessionTopic || null,
          }).select('id').single();

          exercises.push({
            id: row ? row.id : null,
            grammarPointId: gp ? gp.id : null,
            grammarLabel: ex.grammarLabel,
            sourceText: ex.sourceText,
            sourceLang: ex.sourceLang,
            expectedText: ex.expectedText,
          });
        }

        idx = 0;
        attempts = [];
        renderExercise();
      } catch (e) {
        renderError(e.message || 'Unknown error');
      }
    }

    function renderExercise() {
      submitted = false;
      const ex = exercises[idx];
      const learning = langByCode(profile.target_language);
      const fromTarget = ex.sourceLang === 'target';

      document.getElementById('progressLabel').textContent = `${planStepPrefix()}${idx + 1}/${exercises.length}`;
      const nativeDisplay = nativeLangDisplay(profile.native_language);
      const targetDisplay = langDisplay(learning.code);
      document.getElementById('translateBody').innerHTML = `
        <div class="lesson-body">
          <span class="chip-mini">${fromTarget ? targetDisplay + ' → ' + nativeDisplay : nativeDisplay + ' → ' + targetDisplay}</span>
          <div class="card" style="margin-top:14px;display:flex;align-items:center;gap:10px;">
            <button class="icon-btn icon-btn-sm" id="speakBtn" style="${fromTarget ? '' : 'visibility:hidden;'}">🔊</button>
            <p style="font-size:17px;font-weight:700;font-family:var(--font-display);">${ex.sourceText}</p>
          </div>
          <label class="label" style="margin-top:22px;">${t('tr.yourTranslation')}</label>
          <textarea id="answerInput" class="input" rows="3" style="resize:none;" placeholder="${t('tr.typeHere')}"></textarea>
          <button class="btn-primary" id="submitBtn" style="margin-top:18px;width:100%;justify-content:center;" disabled>${t('tr.check')}</button>
          <div id="feedbackSlot" style="margin-top:16px;"></div>
        </div>`;

      if (fromTarget) {
        document.getElementById('speakBtn').addEventListener('click', () => speak(ex.sourceText, learning.tts));
      }

      const input = document.getElementById('answerInput');
      const submitBtn = document.getElementById('submitBtn');
      input.addEventListener('input', () => { submitBtn.disabled = input.value.trim().length === 0; });
      submitBtn.addEventListener('click', () => { submitted ? nextExercise() : submitAnswer(); });
    }

    async function submitAnswer() {
      const ex = exercises[idx];
      const input = document.getElementById('answerInput');
      const submitBtn = document.getElementById('submitBtn');
      const answer = input.value.trim();
      submitBtn.disabled = true;
      submitBtn.textContent = t('tr.checking');
      input.disabled = true;

      let result;
      try {
        const token = await getAuthToken();
        const res = await fetch(TRANSLATE_GRADE_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body: JSON.stringify({
            sourceText: ex.sourceText,
            expectedText: ex.expectedText,
            userAnswer: answer,
            targetLanguage: langByCode(profile.target_language).name,
            nativeLanguage: profile.native_language,
            grammarLabel: ex.grammarLabel,
          }),
        });
        const raw = await res.text();
        const data = JSON.parse(raw);
        if (!res.ok || data.error) throw new Error(data.error || ('HTTP ' + res.status));
        result = data;
      } catch (e) {
        result = { isCorrect: null, feedback: "Couldn't reach the grader (" + (e.message || 'error') + '). Moving on.' };
      }

      submitted = true;
      attempts.push({ exercise: ex, answer, correct: result.isCorrect === true });

      if (ex.id) {
        await db.from('translation_attempts').insert({
          user_id: user.id, exercise_id: ex.id, user_answer: answer,
          is_correct: result.isCorrect === true, feedback: result.feedback || null,
        });
      }
      if (ex.grammarPointId && result.isCorrect !== null) {
        await recordSkillResult(user.id, 'grammar', ex.grammarPointId, result.isCorrect === true);
      }

      const box = document.getElementById('feedbackSlot');
      const good = result.isCorrect;
      box.innerHTML = `
        <div class="feedback-box ${good === null ? '' : good ? 'correct' : 'wrong'}">
          <p style="font-weight:800;">${good === null ? t('tr.skipped') : good ? t('tr.niceWork') : t('tr.notQuite')}</p>
          <p class="text-dim" style="font-size:13.5px;margin-top:4px;">${result.feedback || ''}</p>
          ${good === false ? `<p class="text-faint" style="font-size:12px;margin-top:8px;">${t('tr.oneGoodAnswer')} <b style="color:var(--text);">${ex.expectedText}</b></p>` : ''}
        </div>
        ${grammarLessonHTML(result)}`;
      saveGrammarLesson(user.id, profile.target_language, profile.current_level, result);

      submitBtn.disabled = false;
      submitBtn.textContent = idx + 1 < exercises.length ? t('tr.next') : t('tr.finishSet');
    }

    function nextExercise() {
      if (idx + 1 < exercises.length) { idx++; renderExercise(); }
      else finishSet();
    }

    async function finishSet() {
      const correctCount = attempts.filter(a => a.correct).length;
      const flagged = [...new Map(
        attempts.filter(a => !a.correct && a.exercise.grammarPointId)
          .map(a => [a.exercise.grammarPointId, a.exercise.grammarLabel])
      ).values()];
      const xpEarned = 15 + correctCount * 8;

      document.getElementById('translateBody').innerHTML = `
        <div class="lesson-center">
          <div style="font-size:40px;">🏆</div>
          <h2 style="font-size:24px;margin:14px 0 4px;">${t('tr.setComplete')}</h2>
          <p class="text-dim" style="font-size:14.5px;">${t('tr.correctOfTotal', { c: correctCount, t: attempts.length })}</p>
          ${flagged.length ? `
            <div class="card" style="margin-top:18px;text-align:left;max-width:340px;">
              <span class="label">${t('tr.flaggedForReview')}</span>
              <p class="text-dim" style="font-size:13px;">${flagged.join(', ')}</p>
              <p class="text-faint" style="font-size:11.5px;margin-top:6px;">${t('tr.comeBackAround')}</p>
            </div>` : ''}
          <div id="levelUpSlot" style="width:100%;"></div>
          <button class="btn-primary" id="doneBtn" style="margin-top:20px;">${planCtx ? t('pl.continuePlan') : t('tr.backToHome')}</button>
        </div>`;
      document.getElementById('doneBtn').addEventListener('click', () => {
        if (planCtx) { window.location.href = advancePlanAndGetNextUrl(planCtx.plan, xpEarned); }
        else { window.location.href = 'dashboard.html'; }
      });

      await updateStreakAndActivity(user, profile, xpEarned, 'translate');

      const levelUp = await recordActivityAndMaybeEvaluate(user, profile);
      const newBadges = await checkAndAwardBadges(user, profile);
      document.getElementById('levelUpSlot').innerHTML = (levelUp ? celebrationHTML(levelUp) : '') + badgesEarnedHTML(newBadges);
    }

    document.getElementById('exitBtn').addEventListener('click', () => { window.location.href = 'dashboard.html'; });

    (async () => {
      user = await requireAuth();
      if (!user) return;
      profile = await getProfile(user.id);
      if (!profile || !profile.name) { window.location.href = 'onboarding.html'; return; }
      setLocale(profile.native_language);
      planCtx = isPlanStepActive('translate');
      document.getElementById('progressLabel').textContent = '';
      if (planCtx) {
        sessionTopic = pickTopicForSession(getLastTopics(profile));
        loadSet();
      } else {
        renderTopicPicker(document.getElementById('translateBody'), {
          initial: getLastTopics(profile),
          onStart: async (selection) => {
            await saveLastTopics(user.id, selection);
            sessionTopic = pickTopicForSession(selection);
            loadSet();
          },
        });
      }
    })();
  </script>
</body>
</html>
