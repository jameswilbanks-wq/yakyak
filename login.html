<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YakYak — Sign in</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="center-screen">
    <div class="fade-slide" style="width:100%;max-width:380px;">
      <div id="mascotSlot" style="margin:0 auto 16px;width:52px;"></div>
      <h1 style="font-size:28px;margin-bottom:6px;">Hey! I'm Yak.</h1>
      <p class="text-dim" id="subhead" style="margin-bottom:28px;font-size:15px;"></p>

      <div id="emailStep">
        <label class="label" id="emailLabel">Email</label>
        <input id="email" type="email" class="input" style="margin-bottom:16px;" autocomplete="email">
        <p id="emailError" class="text-dim" style="color:var(--danger);font-size:13px;min-height:18px;margin:0 0 8px;"></p>
        <button id="sendLinkBtn" class="btn-primary" style="width:100%;justify-content:center;">Send me a sign-in link</button>
      </div>

      <div id="sentStep" style="display:none;">
        <div class="card" style="text-align:center;">
          <div style="font-size:30px;">📬</div>
          <p class="text-dim" id="checkEmailMsg" style="margin-top:10px;font-size:14px;"></p>
        </div>
        <p style="text-align:center;margin-top:18px;">
          <button id="resendBtn" class="btn-ghost" style="display:inline;padding:0;text-decoration:underline;font-size:13px;">Resend</button>
          <span style="margin:0 6px;color:var(--text-faint);">·</span>
          <button id="backBtn" class="btn-ghost" style="display:inline;padding:0;text-decoration:underline;font-size:13px;">Use a different email</button>
        </p>
      </div>
    </div>
  </div>

  <script src="supabase-client.js"></script>
  <script src="i18n.js"></script>
  <script>
    document.getElementById('mascotSlot').innerHTML = mascotHTML(52);
    document.getElementById('subhead').textContent = t('lg.subtitle');
    document.getElementById('emailLabel').textContent = t('lg.emailLabel');
    document.getElementById('email').placeholder = t('lg.emailPlaceholder');
    document.getElementById('sendLinkBtn').textContent = t('lg.sendLink');
    document.getElementById('resendBtn').textContent = t('lg.resend');
    document.getElementById('backBtn').textContent = t('lg.useAnotherEmail');

    let currentEmail = '';

    const emailEl = document.getElementById('email');
    const emailError = document.getElementById('emailError');
    const sendLinkBtn = document.getElementById('sendLinkBtn');
    const emailStep = document.getElementById('emailStep');
    const sentStep = document.getElementById('sentStep');
    const checkEmailMsg = document.getElementById('checkEmailMsg');
    const resendBtn = document.getElementById('resendBtn');
    const backBtn = document.getElementById('backBtn');

    function isValidEmail(v) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }

    async function sendLink() {
      const email = emailEl.value.trim();
      emailError.textContent = '';
      if (!isValidEmail(email)) { emailError.textContent = t('lg.errorEmail'); return; }
      currentEmail = email;
      sendLinkBtn.disabled = true;
      sendLinkBtn.textContent = t('lg.sending');
      try {
        const { error } = await db.auth.signInWithOtp({
          email,
          options: { shouldCreateUser: true, emailRedirectTo: window.location.origin + '/index.html' },
        });
        if (error) throw error;
        checkEmailMsg.textContent = t('lg.checkEmailLink', { email: currentEmail });
        emailStep.style.display = 'none';
        sentStep.style.display = 'block';
      } catch (e) {
        emailError.textContent = e.message || t('lg.errorGeneric');
      } finally {
        sendLinkBtn.disabled = false;
        sendLinkBtn.textContent = t('lg.sendLink');
      }
    }

    sendLinkBtn.addEventListener('click', sendLink);
    emailEl.addEventListener('keydown', e => { if (e.key === 'Enter') sendLink(); });
    resendBtn.addEventListener('click', sendLink);
    backBtn.addEventListener('click', () => {
      sentStep.style.display = 'none';
      emailStep.style.display = 'block';
      emailError.textContent = '';
    });
  </script>
</body>
</html>
