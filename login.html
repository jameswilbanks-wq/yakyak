<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YakYak — Sign in</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="center-screen">
    <div class="fade-slide" style="width:100%;max-width:380px;">
      <div id="mascotSlot" style="margin:0 auto 16px;width:52px;"></div>
      <h1 style="font-size:28px;margin-bottom:6px;">Hey! I'm Yak.</h1>
      <p class="text-dim" id="subhead" style="margin-bottom:28px;font-size:15px;">Sign in to keep learning.</p>

      <label class="label">Email</label>
      <input id="email" type="email" class="input" placeholder="you@example.com" style="margin-bottom:16px;">

      <label class="label">Password</label>
      <input id="password" type="password" class="input" placeholder="••••••••" style="margin-bottom:8px;">

      <p id="errorMsg" class="text-dim" style="color:var(--danger);font-size:13px;min-height:18px;margin:8px 0;"></p>

      <button id="submitBtn" class="btn-primary" style="width:100%;justify-content:center;margin-top:12px;">
        Sign in
      </button>

      <p class="text-dim" style="text-align:center;margin-top:20px;font-size:13.5px;">
        <span id="toggleText">New here?</span>
        <button id="toggleMode" class="btn-ghost" style="display:inline;padding:0;text-decoration:underline;">Create an account</button>
      </p>
    </div>
  </div>

  <script src="supabase-client.js"></script>
  <script>
    document.getElementById('mascotSlot').innerHTML = mascotHTML(52);

    let mode = 'signin'; // or 'signup'
    const emailEl = document.getElementById('email');
    const passwordEl = document.getElementById('password');
    const errorEl = document.getElementById('errorMsg');
    const submitBtn = document.getElementById('submitBtn');
    const toggleBtn = document.getElementById('toggleMode');
    const toggleText = document.getElementById('toggleText');
    const subhead = document.getElementById('subhead');

    toggleBtn.addEventListener('click', () => {
      mode = mode === 'signin' ? 'signup' : 'signin';
      submitBtn.textContent = mode === 'signin' ? 'Sign in' : 'Create account';
      toggleText.textContent = mode === 'signin' ? 'New here?' : 'Already have an account?';
      toggleBtn.textContent = mode === 'signin' ? 'Create an account' : 'Sign in instead';
      subhead.textContent = mode === 'signin' ? 'Sign in to keep learning.' : "Let's get your account set up.";
      errorEl.textContent = '';
    });

    submitBtn.addEventListener('click', async () => {
      const email = emailEl.value.trim();
      const password = passwordEl.value;
      if (!email || !password) { errorEl.textContent = 'Enter an email and password.'; return; }
      submitBtn.disabled = true;
      errorEl.textContent = '';

      try {
        if (mode === 'signup') {
          const { error } = await db.auth.signUp({ email, password });
          if (error) throw error;
        } else {
          const { error } = await db.auth.signInWithPassword({ email, password });
          if (error) throw error;
        }
        window.location.href = 'index.html';
      } catch (e) {
        errorEl.textContent = e.message || 'Something went wrong.';
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
