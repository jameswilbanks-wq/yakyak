<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YakYak — Sign in</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="center-screen">
    <div class="fade-slide" style="width:100%;max-width:380px;">
      <div id="mascotSlot" style="margin:0 auto 16px;width:52px;"></div>
      <h1 style="font-size:28px;margin-bottom:6px;">Hey! I'm Yak.</h1>
      <p class="text-dim" id="subhead" style="margin-bottom:28px;font-size:15px;"></p>

      <div id="formStep">
        <label class="label" id="emailLabel">Email</label>
        <input id="email" type="email" class="input" style="margin-bottom:16px;" autocomplete="email">

        <label class="label" id="passwordLabel">Password</label>
        <input id="password" type="password" class="input" style="margin-bottom:8px;" autocomplete="current-password">

        <p id="formError" class="text-dim" style="color:var(--danger);font-size:13px;min-height:18px;margin:8px 0;"></p>

        <button id="submitBtn" class="btn-primary" style="width:100%;justify-content:center;margin-top:4px;">Sign in</button>

        <p style="text-align:center;margin-top:20px;font-size:13.5px;">
          <span id="toggleText" class="text-dim">New here?</span>
          <button id="toggleModeBtn" class="btn-ghost" style="display:inline;padding:0;text-decoration:underline;">Create an account</button>
        </p>
      </div>

      <div id="confirmStep" style="display:none;">
        <div class="card" style="text-align:center;">
          <div style="color:var(--accent-ink);"><svg class="icon" style="width:30px;height:30px" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 6.5l9 6 9-6"/></svg></div>
          <p class="text-dim" id="confirmMsg" style="margin-top:10px;font-size:14px;"></p>
        </div>
        <button id="backToFormBtn" class="btn-ghost" style="width:100%;justify-content:center;margin-top:16px;text-decoration:underline;">Back</button>
      </div>
    </div>
  </div>

  <script src="supabase-client.js"></script>
  <script src="i18n.js"></script>
  <script>
    document.getElementById('mascotSlot').innerHTML = mascotHTML(52);

    let mode = new URLSearchParams(window.location.search).get('mode') === 'signup' ? 'signup' : 'signin';
    const emailEl = document.getElementById('email');
    const passwordEl = document.getElementById('password');
    const formError = document.getElementById('formError');
    const submitBtn = document.getElementById('submitBtn');
    const toggleBtn = document.getElementById('toggleModeBtn');
    const toggleText = document.getElementById('toggleText');
    const subhead = document.getElementById('subhead');
    const formStep = document.getElementById('formStep');
    const confirmStep = document.getElementById('confirmStep');
    const confirmMsg = document.getElementById('confirmMsg');
    const backToFormBtn = document.getElementById('backToFormBtn');
    const emailLabel = document.getElementById('emailLabel');
    const passwordLabel = document.getElementById('passwordLabel');

    function applyModeCopy() {
      submitBtn.textContent = mode === 'signin' ? t('lg.signIn') : t('lg.createAccount');
      toggleText.textContent = mode === 'signin' ? t('lg.newHere') : t('lg.alreadyHaveAccount');
      toggleBtn.textContent = mode === 'signin' ? t('lg.createAccount') : t('lg.signInInstead');
      subhead.textContent = t('lg.subtitle');
    }

    emailLabel.textContent = t('lg.emailLabel');
    emailEl.placeholder = t('lg.emailPlaceholder');
    passwordLabel.textContent = t('lg.passwordLabel');
    passwordEl.placeholder = t('lg.passwordPlaceholder');
    applyModeCopy();

    toggleBtn.addEventListener('click', () => {
      mode = mode === 'signin' ? 'signup' : 'signin';
      formError.textContent = '';
      applyModeCopy();
    });

    function isValidEmail(v) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }

    async function submit() {
      const email = emailEl.value.trim();
      const password = passwordEl.value;
      formError.textContent = '';
      if (!isValidEmail(email)) { formError.textContent = t('lg.errorEmail'); return; }
      if (password.length < 6) { formError.textContent = t('lg.errorPasswordShort'); return; }

      submitBtn.disabled = true;
      submitBtn.textContent = mode === 'signin' ? t('lg.signingIn') : t('lg.creatingAccount');

      try {
        if (mode === 'signup') {
          const { data, error } = await db.auth.signUp({ email, password });
          if (error) throw error;
          if (data.session) {
            window.location.href = 'index.html';
            return;
          }
          confirmMsg.textContent = t('lg.confirmEmailNotice');
          formStep.style.display = 'none';
          confirmStep.style.display = 'block';
        } else {
          const { error } = await db.auth.signInWithPassword({ email, password });
          if (error) throw error;
          window.location.href = 'index.html';
          return;
        }
      } catch (e) {
        formError.textContent = e.message || t('lg.errorGeneric');
      } finally {
        submitBtn.disabled = false;
        applyModeCopy();
      }
    }

    submitBtn.addEventListener('click', submit);
    passwordEl.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
    emailEl.addEventListener('keydown', e => { if (e.key === 'Enter') passwordEl.focus(); });
    backToFormBtn.addEventListener('click', () => {
      confirmStep.style.display = 'none';
      formStep.style.display = 'block';
      mode = 'signin';
      applyModeCopy();
    });
  </script>
</body>
</html>
