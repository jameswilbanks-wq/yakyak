<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YakYak — Reading</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="lesson-wrap">
    <div class="lesson-top">
      <div style="display:flex;align-items:center;gap:8px;">
        <div class="mascot" style="width:20px;height:20px;">
          <div class="eyes" style="gap:3.6px;"><div class="eye" style="width:2px;height:2px;"></div><div class="eye" style="width:2px;height:2px;"></div></div>
          <div class="smile" style="bottom:4.8px;width:5.6px;height:2.8px;border-bottom-width:2px;"></div>
        </div>
        <button class="icon-btn" id="exitBtn"><svg class="icon" viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
      </div>
      <span class="text-faint" id="topLabel" style="font-size:12.5px;"></span>
    </div>
    <div id="readingBody"></div>
  </div>

  <script src="supabase-client.js"></script>
  <script src="i18n.js"></script>
  <script>
    // Unified Reading module — replaces the old reading.html ("Reading
    // Library", extensive/Storybook) + input.html ("Listen & read",
    // mic-graded intensive) with one entry point, one shared passage
    // generator/table (generate-reading-passage / reading_passages /
    // reading_completions), and one continuity pool so "avoid recently
    // read titles" works across both instead of each module repeating the
    // other's topics. See project docs for the pedagogy this is grounded
    // in (comprehensible-input coverage targets, accountability via a real
    // comprehension check, read-while-listening).
    //
    // `mode` picks which experience: 'extensive' (silent/Storybook, low
    // stakes, narrator-on by default, ends in a light comprehension quiz)
    // or 'intensive' (short passage, sentence-by-sentence, mic-graded
    // pronunciation + per-sentence comprehension check — the old
    // input.html flow, `kind` sub-selects reading vs listening).
    let user = null, profile = null, passage = null, passageId = null, sessionTopic = null;
    let mode = null; // 'extensive' | 'intensive'
    let kind = null; // 'reading' | 'listening' — intensive only
    let planCtx = null; // { plan, step } if running as a lesson-plan step, else null

    // --- extensive-mode state ---
    let qIdx = 0, results = [];
    const READING_RATE = { normal: 0.95, slow: 0.6 };
    let speed = localStorage.getItem('yakyak_reading_speed') || 'normal';
    let translationOn = localStorage.getItem('yakyak_reading_translation') === '1';
    // 'guided' = sentence-by-sentence, chunk-aligned, read-along mode.
    // 'storybook' = continuous-paragraph, tap-any-word-to-look-it-up mode,
    // styled like a real book. Same underlying passage either way — the
    // toggle just switches how it's rendered. (Named subMode, not mode —
    // `mode` at the top level is now extensive/intensive.)
    let subMode = localStorage.getItem('yakyak_reading_mode') || 'guided';
    // Storybook's read-along narrator: reads the whole passage aloud,
    // sentence by sentence, with a live word-by-word highlight. Defaults
    // on (research-backed: reading-while-listening scaffolds comprehension
    // and builds listening proficiency) but stays a real per-device toggle.
    let readerOn = localStorage.getItem('yakyak_reading_reader') !== '0';
    let isPlaying = false;
    let stopRequested = false;
    let playSession = 0;

    // --- intensive-mode state ---
    let sIdx = 0, sentenceResults = [], playedOnce = false;
    let recognition = null, isRecording = false;
    let mediaRecorder = null, mediaStream = null, audioChunks = [], liveTranscript = '';
    let activeMicBtn = null, activeHint = null, activeTargetText = null, activeOnGraded = null;
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    const micSupported = !!SR;

    function planStepPrefix() {
      if (!planCtx) return '';
      return t('pl.stepOfTotal', { i: planCtx.plan.currentIndex + 1, n: planCtx.plan.steps.length });
    }

    // --- Mode picker: Read & Listen vs Read Aloud & Check ---
    function renderModePicker() {
      document.getElementById('topLabel').textContent = '';
      document.getElementById('readingBody').innerHTML = `
        <div class="lesson-body">
          <h1 style="font-size:24px;margin-bottom:6px;">${t('rl.pickModeTitle')}</h1>
          <p class="text-dim" style="font-size:14px;margin-bottom:20px;">${t('rl.pickModeDesc')}</p>
          <div style="display:flex;flex-direction:column;gap:10px;">
            <button class="row-option" id="pickExtensive"><span style="font-weight:700;">${icon('book', { size: 15 })} ${t('rl.modeExtensive')}</span><span class="text-faint" style="font-size:12.5px;">${t('rl.modeExtensiveDesc')}</span></button>
            <button class="row-option" id="pickIntensive"><span style="font-weight:700;">${icon('mic', { size: 15 })} ${t('rl.modeIntensive')}</span><span class="text-faint" style="font-size:12.5px;">${t('rl.modeIntensiveDesc')}</span></button>
          </div>
        </div>`;
      document.getElementById('pickExtensive').addEventListener('click', () => { mode = 'extensive'; kind = null; loadPassage(); });
      document.getElementById('pickIntensive').addEventListener('click', () => { mode = 'intensive'; renderKindPicker(); });
    }

    // Reading vs listening sub-choice, only within intensive mode (ported
    // from the old input.html topic-picker-adjacent screen).
    function renderKindPicker() {
      document.getElementById('topLabel').textContent = '';
      document.getElementById('readingBody').innerHTML = `
        <div class="lesson-body">
          <h1 style="font-size:24px;margin-bottom:6px;">${t('in.listenOrRead')}</h1>
          <p class="text-dim" style="font-size:14px;margin-bottom:20px;">${t('in.eitherWay')}</p>
          <div style="display:flex;flex-direction:column;gap:10px;">
            <button class="row-option" id="pickReading"><span style="font-weight:700;">${icon('book', { size: 15 })} ${t('in.reading')}</span><span class="text-faint" style="font-size:12.5px;">${t('in.seeItReadIt')}</span></button>
            <button class="row-option" id="pickListening"><span style="font-weight:700;">${icon('headphones', { size: 15 })} ${t('in.listening')}</span><span class="text-faint" style="font-size:12.5px;">${t('in.hearItSayBack')}</span></button>
          </div>
          ${!micSupported ? `<p class="text-faint" style="font-size:11.5px;margin-top:16px;">${t('in.noMicSupport')}</p>` : ''}
        </div>`;
      document.getElementById('pickReading').addEventListener('click', () => { kind = 'reading'; loadPassage(); });
      document.getElementById('pickListening').addEventListener('click', () => { kind = 'listening'; loadPassage(); });
    }

    function renderLoading() {
      document.getElementById('readingBody').innerHTML = `
        <div class="lesson-center">
          <div id="mascotSlot" style="width:52px;"></div>
          <p class="text-dim" style="margin-top:16px;font-size:14.5px;">${t('rl.building')}</p>
        </div>`;
      document.getElementById('mascotSlot').innerHTML = mascotHTML(52);
    }

    function renderError(message) {
      document.getElementById('readingBody').innerHTML = `
        <div class="lesson-center error-box">
          <div style="color:var(--danger);">${icon('warning', { size: 30 })}</div>
          <p style="font-weight:700;">${t('rl.couldntBuild')}</p>
          <p class="text-faint" style="font-size:12.5px;max-width:320px;">${message}</p>
          <button class="btn-primary" id="retryBtn" style="margin-top:8px;">${t('ls.tryAgain')}</button>
        </div>`;
      document.getElementById('retryBtn').addEventListener('click', loadPassage);
    }

    // Shared passage fetch for both modes — one continuity pool (the
    // "avoid" list is drawn from the unified reading_passages table
    // regardless of mode) so a learner doesn't get the same topic twice
    // just because they switched modes.
    async function loadPassage() {
      renderLoading();
      try {
        const avoid = await fetchRecentValues('reading_passages', 'title', profile.target_language, profile.current_level, 8);
        const reinforceWords = await getWeakWords(user.id, profile.target_language, 6);
        const token = await getAuthToken();
        const res = await fetch(GENERATE_READING_PASSAGE_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body: JSON.stringify({
            targetLanguage: langByCode(profile.target_language).name,
            nativeLanguage: profile.native_language,
            level: profile.current_level,
            interest: sessionTopic || 'daily life',
            angle: randomAngle(),
            avoid,
            reinforceWords,
            mode,
            kind,
          }),
        });
        const raw = await res.text();
        if (!raw) throw new Error('Empty response (HTTP ' + res.status + ')');
        const data = JSON.parse(raw);
        if (!res.ok || data.error) throw new Error(data.error || ('HTTP ' + res.status));
        if (!data.sentences || !data.sentences.length) throw new Error('No passage returned');
        if (mode === 'extensive' && (!data.questions || !data.questions.length)) throw new Error('No passage returned');
        passage = data;

        const { data: row } = await db.from('reading_passages').insert({
          target_language: profile.target_language,
          native_language: profile.native_language,
          level: profile.current_level,
          mode,
          kind: mode === 'intensive' ? kind : null,
          title: data.title,
          body: data.body,
          sentences: data.sentences,
          comprehension_questions: data.questions || [],
          interest_tag: sessionTopic || null,
        }).select('id').single();
        passageId = row ? row.id : null;

        if (mode === 'extensive') {
          renderPassage();
        } else {
          sIdx = 0;
          sentenceResults = [];
          renderReadStep();
        }
      } catch (e) {
        renderError(e.message || 'Unknown error');
      }
    }

    // ============================================================
    // Extensive mode: Guided (sentence rows) / Storybook (tap-to-look-up)
    // ============================================================

    function sentenceToSpansHTML(text) {
      let html = '';
      let last = 0;
      const regex = /\S+/g;
      let m;
      while ((m = regex.exec(text))) {
        html += escapeHtml(text.slice(last, m.index));
        html += `<span class="rl-word" data-start="${m.index}">${escapeHtml(m[0])}</span>`;
        last = m.index + m[0].length;
      }
      html += escapeHtml(text.slice(last));
      return html;
    }

    // sentenceToChunkedSpansHTML and wireChunkHover live in
    // supabase-client.js (shared with vocab.html's example-sentence
    // hover-align).

    function highlightWordAt(sentenceEl, charIndex) {
      const spans = sentenceEl.querySelectorAll('.rl-word');
      let target = null;
      spans.forEach(s => {
        s.style.background = 'transparent';
        if (parseInt(s.dataset.start, 10) <= charIndex) target = s;
      });
      if (target) { target.style.background = 'var(--mint-soft)'; target.style.borderRadius = '4px'; }
    }

    function clearHighlight(sentenceEl) {
      sentenceEl.querySelectorAll('.rl-word').forEach(s => { s.style.background = 'transparent'; });
    }

    function updatePlayButtonLabel() {
      const btn = document.getElementById('playAllBtn');
      if (btn) btn.textContent = isPlaying ? ('⏸ ' + t('rl.stop')) : ('▶ ' + t('rl.playAll'));
    }

    function stopPlayback() {
      stopRequested = true;
      isPlaying = false;
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      updatePlayButtonLabel();
    }

    function playSentence(idx, onEnd) {
      const s = passage.sentences[idx];
      const sentenceEl = document.querySelector(`.rl-sentence[data-idx="${idx}"]`);
      if (!('speechSynthesis' in window) || !sentenceEl || !s) { onEnd(); return; }
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(s.target);
      u.lang = langByCode(profile.target_language).tts;
      u.rate = READING_RATE[speed] || 0.95;
      u.onboundary = (e) => { if (!e.name || e.name === 'word') highlightWordAt(sentenceEl, e.charIndex); };
      u.onend = () => { clearHighlight(sentenceEl); onEnd(); };
      u.onerror = () => { clearHighlight(sentenceEl); onEnd(); };
      window.speechSynthesis.speak(u);
    }

    function playAll() {
      isPlaying = true;
      stopRequested = false;
      const session = ++playSession;
      updatePlayButtonLabel();
      const step = (idx) => {
        if (session !== playSession) return;
        if (stopRequested || idx >= passage.sentences.length) { isPlaying = false; stopRequested = false; updatePlayButtonLabel(); return; }
        playSentence(idx, () => step(idx + 1));
      };
      step(0);
    }

    // Dispatches to whichever sub-mode is active. Both share the exact
    // same loaded `passage` — switching the toggle just re-renders, it
    // never re-fetches.
    function renderPassage() {
      stopPlayback();
      if (subMode === 'storybook') renderStorybook(); else renderGuided();
    }

    function modeToggleHTML() {
      return `
        <div style="display:flex;gap:6px;margin-bottom:10px;">
          <button class="chip${subMode === 'guided' ? ' active' : ''}" id="modeGuidedBtn" style="padding:4px 10px;font-size:12px;">${t('rl.guided')}</button>
          <button class="chip${subMode === 'storybook' ? ' active' : ''}" id="modeStorybookBtn" style="padding:4px 10px;font-size:12px;">${t('rl.storybook')}</button>
        </div>`;
    }

    function wireModeToggle() {
      document.getElementById('modeGuidedBtn').addEventListener('click', () => {
        if (subMode === 'guided') return;
        subMode = 'guided';
        localStorage.setItem('yakyak_reading_mode', subMode);
        renderPassage();
      });
      document.getElementById('modeStorybookBtn').addEventListener('click', () => {
        if (subMode === 'storybook') return;
        subMode = 'storybook';
        localStorage.setItem('yakyak_reading_mode', subMode);
        renderPassage();
      });
    }

    function renderGuided() {
      document.getElementById('topLabel').textContent = t('rl.freeReading');
      const sentencesHTML = passage.sentences.map((s, i) => {
        const { targetHTML, nativeHTML } = sentenceToChunkedSpansHTML(s.chunks || [], i);
        return `
        ${s.newParagraph && i > 0 ? '<div style="height:14px;"></div>' : ''}
        <div class="rl-sentence" data-idx="${i}" style="margin-bottom:${translationOn ? '14px' : '4px'};">
          <div style="display:flex;align-items:baseline;gap:8px;">
            <button class="icon-btn icon-btn-sm rl-sentence-play" data-idx="${i}" style="flex-shrink:0;">${icon('speaker', { size: 14 })}</button>
            <span style="font-size:15.5px;line-height:1.8;">${targetHTML}</span>
          </div>
          ${translationOn ? `<div class="text-faint" style="font-size:12.5px;line-height:1.6;margin-left:34px;margin-top:2px;">${nativeHTML}</div>` : ''}
        </div>`;
      }).join('');

      document.getElementById('readingBody').innerHTML = `
        <div class="lesson-body">
          ${modeToggleHTML()}
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px;">
            <button class="btn-ghost" id="playAllBtn" style="padding:6px 12px;">▶ ${t('rl.playAll')}</button>
            <button class="chip${speed === 'normal' ? ' active' : ''}" data-speed="normal" style="padding:4px 10px;font-size:12px;">${t('rl.speedNormal')}</button>
            <button class="chip${speed === 'slow' ? ' active' : ''}" data-speed="slow" style="padding:4px 10px;font-size:12px;">${t('rl.speedSlow')}</button>
            <button class="chip${translationOn ? ' active' : ''}" id="translationToggle" style="padding:4px 10px;font-size:12px;margin-left:auto;">${translationOn ? t('rl.hideTranslation') : t('rl.showTranslation')}</button>
          </div>
          <p class="text-faint" style="font-size:11px;margin-bottom:10px;">${t('rl.hoverHint')}</p>
          <h1 style="font-size:19px;font-family:var(--font-display);margin-bottom:10px;">${passage.title}</h1>
          <div class="card">${sentencesHTML}</div>
          ${passage.glossary && passage.glossary.length ? `
            <div class="card" style="margin-top:14px;">
              <span class="label" style="margin-bottom:6px;">${t('rl.glossary')}</span>
              <div style="display:flex;flex-direction:column;gap:6px;">
                ${passage.glossary.map(g => `<div style="display:flex;gap:8px;font-size:13px;"><b style="font-family:var(--font-display);">${g.term}</b><span class="text-dim">— ${g.meaning}</span></div>`).join('')}
              </div>
            </div>` : ''}
          <button class="btn-primary" id="doneReadingBtn" style="margin-top:20px;width:100%;justify-content:center;">${t('rl.doneReading')}</button>
        </div>`;

      updatePlayButtonLabel();
      wireModeToggle();
      document.getElementById('playAllBtn').addEventListener('click', () => { isPlaying ? stopPlayback() : playAll(); });
      document.querySelectorAll('[data-speed]').forEach(b => b.addEventListener('click', () => {
        speed = b.dataset.speed;
        localStorage.setItem('yakyak_reading_speed', speed);
        stopPlayback();
        renderGuided();
      }));
      document.getElementById('translationToggle').addEventListener('click', () => {
        translationOn = !translationOn;
        localStorage.setItem('yakyak_reading_translation', translationOn ? '1' : '0');
        stopPlayback();
        renderGuided();
      });
      document.querySelectorAll('.rl-sentence-play').forEach(b => b.addEventListener('click', () => {
        stopPlayback();
        playSentence(parseInt(b.dataset.idx, 10), () => {});
      }));
      document.getElementById('doneReadingBtn').addEventListener('click', () => { stopPlayback(); startQuestions(); });
      wireChunkHover();
    }

    function sentenceToTapSpansHTML(text, sIdxLocal) {
      let html = '';
      let last = 0;
      const regex = /[\p{L}\p{M}'’-]+/gu;
      let m;
      while ((m = regex.exec(text))) {
        html += escapeHtml(text.slice(last, m.index));
        html += `<span class="sb-word" data-word="${escapeHtml(m[0])}" data-sidx="${sIdxLocal}" data-start="${m.index}">${escapeHtml(m[0])}</span>`;
        last = m.index + m[0].length;
      }
      html += escapeHtml(text.slice(last));
      return html;
    }

    function highlightStoryWordAt(sIdxLocal, charIndex) {
      const spans = document.querySelectorAll(`.sb-word[data-sidx="${sIdxLocal}"]`);
      let target = null;
      spans.forEach(s => {
        s.classList.remove('sb-word-active');
        if (parseInt(s.dataset.start, 10) <= charIndex) target = s;
      });
      if (target) target.classList.add('sb-word-active');
    }

    function clearStoryHighlight() {
      document.querySelectorAll('.sb-word-active').forEach(s => s.classList.remove('sb-word-active'));
    }

    function playStorySentence(idx, onEnd) {
      const s = passage.sentences[idx];
      if (!('speechSynthesis' in window) || !s) { onEnd(); return; }
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(s.target);
      u.lang = langByCode(profile.target_language).tts;
      u.rate = READING_RATE[speed] || 0.95;
      u.onboundary = (e) => { if (!e.name || e.name === 'word') highlightStoryWordAt(idx, e.charIndex); };
      u.onend = () => { clearStoryHighlight(); onEnd(); };
      u.onerror = () => { clearStoryHighlight(); onEnd(); };
      window.speechSynthesis.speak(u);
    }

    function playStoryAll() {
      isPlaying = true;
      stopRequested = false;
      const session = ++playSession;
      updatePlayButtonLabel();
      const step = (idx) => {
        if (session !== playSession) return;
        if (stopRequested || idx >= passage.sentences.length) { isPlaying = false; stopRequested = false; updatePlayButtonLabel(); return; }
        playStorySentence(idx, () => step(idx + 1));
      };
      step(0);
    }

    function renderStorybook() {
      document.getElementById('topLabel').textContent = t('rl.storybook');
      const proseHTML = passage.sentences.map((s, i) => {
        const spaced = (s.newParagraph && i > 0) ? '</p><p style="margin-top:14px;">' : ' ';
        return (i === 0 ? '' : spaced) + sentenceToTapSpansHTML(s.target, i);
      }).join('');

      document.getElementById('readingBody').innerHTML = `
        <div class="lesson-body">
          ${modeToggleHTML()}
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px;">
            <button class="chip${readerOn ? ' active' : ''}" id="readerToggleBtn" style="padding:4px 10px;font-size:12px;">${icon('speaker', { size: 12 })} ${readerOn ? t('rl.readerOn') : t('rl.readerOff')}</button>
            ${readerOn ? `
              <button class="btn-ghost" id="playAllBtn" style="padding:6px 12px;">▶ ${t('rl.playAll')}</button>
              <button class="chip${speed === 'normal' ? ' active' : ''}" data-speed="normal" style="padding:4px 10px;font-size:12px;">${t('rl.speedNormal')}</button>
              <button class="chip${speed === 'slow' ? ' active' : ''}" data-speed="slow" style="padding:4px 10px;font-size:12px;">${t('rl.speedSlow')}</button>
            ` : ''}
          </div>
          <p class="text-faint" style="font-size:11px;margin-bottom:14px;">${t('rl.tapHint')}</p>
          <div class="card" style="text-align:center;padding:22px 20px;margin-bottom:14px;">
            <h1 style="font-size:20px;font-family:var(--font-display);">${passage.title}</h1>
            <p class="text-faint" style="font-size:11.5px;margin-top:6px;">${t('rl.freeReading')}</p>
          </div>
          <div class="card" style="font-size:16px;line-height:2;font-family:var(--font-display);">
            <p>${proseHTML}</p>
          </div>
          <button class="btn-primary" id="doneReadingBtn" style="margin-top:20px;width:100%;justify-content:center;">${t('rl.doneReading')}</button>
        </div>`;

      wireModeToggle();
      document.getElementById('readerToggleBtn').addEventListener('click', () => {
        readerOn = !readerOn;
        localStorage.setItem('yakyak_reading_reader', readerOn ? '1' : '0');
        stopPlayback();
        renderStorybook();
      });
      document.querySelectorAll('.sb-word').forEach(el => el.addEventListener('click', () => {
        stopPlayback();
        const sIdxLocal = parseInt(el.dataset.sidx, 10);
        openWordLookup(el.dataset.word, passage.sentences[sIdxLocal] ? passage.sentences[sIdxLocal].target : '');
      }));
      document.getElementById('doneReadingBtn').addEventListener('click', () => { stopPlayback(); startQuestions(); });

      if (readerOn) {
        updatePlayButtonLabel();
        document.getElementById('playAllBtn').addEventListener('click', () => { isPlaying ? stopPlayback() : playStoryAll(); });
        document.querySelectorAll('[data-speed]').forEach(b => b.addEventListener('click', () => {
          speed = b.dataset.speed;
          localStorage.setItem('yakyak_reading_speed', speed);
          stopPlayback();
          renderStorybook();
        }));
        playStoryAll();
      }
    }

    function openWordLookup(word, sentenceContext) {
      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.innerHTML = `
        <div class="modal-card" style="max-width:320px;text-align:center;">
          <div style="display:flex;align-items:center;justify-content:center;gap:8px;">
            <h2 style="font-size:22px;font-family:var(--font-display);">${escapeHtml(word)}</h2>
            <button class="icon-btn icon-btn-sm" id="wordAudioBtn">${icon('speaker', { size: 14 })}</button>
          </div>
          <p class="text-faint" id="wordPhonetic" style="font-size:13px;margin-top:4px;min-height:16px;">${t('rl.lookingUp')}</p>
          <p class="text-dim" id="wordTranslation" style="font-size:15px;margin-top:12px;font-weight:600;min-height:20px;"></p>
          <div style="display:flex;gap:10px;margin-top:20px;" id="wordActions">
            <button class="row-option" id="wordKnowBtn" style="justify-content:center;" disabled><span>${t('rl.iKnowIt')}</span></button>
            <button class="row-option" id="wordLearnBtn" style="border-color:var(--mint);justify-content:center;" disabled><span style="color:var(--mint);font-weight:700;">${t('rl.learnWord')}</span></button>
          </div>
          <div id="wordToast" style="margin-top:10px;font-size:12.5px;color:var(--mint);"></div>
        </div>`;
      document.body.appendChild(overlay);
      overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
      document.getElementById('wordAudioBtn').addEventListener('click', () => speak(word, langByCode(profile.target_language).tts));

      let vocabItemId = null;
      (async () => {
        const result = await getOrCreateWordLookup(
          word, sentenceContext, langByCode(profile.target_language).name, profile.native_language, profile.current_level
        );
        vocabItemId = result.vocabItemId;
        if (!overlay.isConnected) return;
        document.getElementById('wordPhonetic').textContent = result.phonetic || '';
        document.getElementById('wordTranslation').textContent = result.translation || '—';
        document.getElementById('wordKnowBtn').disabled = false;
        document.getElementById('wordLearnBtn').disabled = false;
      })();

      document.getElementById('wordKnowBtn').addEventListener('click', () => overlay.remove());
      document.getElementById('wordLearnBtn').addEventListener('click', async () => {
        if (!vocabItemId) { overlay.remove(); return; }
        document.getElementById('wordLearnBtn').disabled = true;
        await recordSkillResult(user.id, 'vocab', vocabItemId, false);
        document.getElementById('wordToast').textContent = t('rl.addedToReview');
        setTimeout(() => overlay.remove(), 900);
      });
    }

    function startQuestions() {
      qIdx = 0;
      results = [];
      renderQuestion();
    }

    function renderQuestion() {
      const q = passage.questions[qIdx];
      document.getElementById('topLabel').textContent = `${t('rl.comprehension')} · ${qIdx + 1}/${passage.questions.length}`;
      document.getElementById('readingBody').innerHTML = `
        <div class="lesson-body">
          <h2 style="font-size:18px;margin-bottom:16px;">${q.question}</h2>
          <div style="display:flex;flex-direction:column;gap:10px;" id="optionsList"></div>
          <div id="nextQBtn"></div>
        </div>`;
      const list = document.getElementById('optionsList');
      list.innerHTML = q.options.map((opt, i) => `<button class="option" data-i="${i}">${opt}</button>`).join('');
      list.querySelectorAll('.option').forEach(btn => {
        btn.addEventListener('click', () => {
          const chosen = parseInt(btn.dataset.i);
          const correct = chosen === q.answerIndex;
          results.push(correct);
          if (correct) fireConfetti('small');
          list.querySelectorAll('.option').forEach(b => {
            b.disabled = true;
            if (parseInt(b.dataset.i) === q.answerIndex) b.classList.add('correct');
            else if (b === btn) b.classList.add('wrong');
          });
          document.getElementById('nextQBtn').innerHTML = `<button class="btn-primary" id="nextBtn" style="margin-top:20px;width:100%;justify-content:center;">${qIdx + 1 < passage.questions.length ? t('rl.nextQuestion') : t('rl.finish')}</button>`;
          document.getElementById('nextBtn').addEventListener('click', () => {
            if (qIdx + 1 < passage.questions.length) { qIdx++; renderQuestion(); }
            else finishSession();
          });
        });
      });
    }

    async function finishSession() {
      const correctCount = results.filter(Boolean).length;
      const perfect = results.length > 0 && correctCount === results.length;
      const xpEarned = 12 + correctCount * 5;

      document.getElementById('topLabel').textContent = '';
      document.getElementById('readingBody').innerHTML = `
        <div class="lesson-center">
          <div style="color:${perfect ? 'var(--mint)' : 'var(--dark)'};">${icon(perfect ? 'confetti' : 'book', { size: 40 })}</div>
          <h2 style="font-size:24px;margin:14px 0 4px;">${t('rl.passageComplete')}</h2>
          <p class="text-dim" style="font-size:14.5px;">${t('rl.correctOfTotal', { c: correctCount, t: results.length })}</p>
          <div id="levelUpSlot" style="width:100%;"></div>
          <button class="btn-primary" id="doneBtn" style="margin-top:20px;">${planCtx ? t('pl.continuePlan') : t('rl.backToHome')}</button>
        </div>`;
      document.getElementById('doneBtn').addEventListener('click', () => {
        if (planCtx) { window.location.href = advancePlanAndGetNextUrl(planCtx.plan, xpEarned); }
        else { window.location.href = 'dashboard.html'; }
      });
      if (perfect) fireConfetti('big');

      if (passageId) {
        await db.from('reading_completions').insert({
          user_id: user.id, passage_id: passageId, score: correctCount, xp_earned: xpEarned, mode: 'extensive',
        });
      }

      await updateStreakAndActivity(user, profile, xpEarned, 'reading');

      const levelUp = await recordActivityAndMaybeEvaluate(user, profile);
      const newBadges = await checkAndAwardBadges(user, profile);
      document.getElementById('levelUpSlot').innerHTML = (levelUp ? celebrationHTML(levelUp) : '') + badgesEarnedHTML(newBadges);
    }

    // ============================================================
    // Intensive mode: sentence-by-sentence, mic-graded (ported from the
    // old input.html)
    // ============================================================

    function renderProgress() {
      const total = passage.sentences.length;
      return `<div class="sentence-progress" style="margin-bottom:16px;">${passage.sentences.map((_, i) =>
        `<div class="seg${i < sIdx ? ' done' : i === sIdx ? ' current' : ''}"></div>`).join('')}</div>`;
    }

    function renderReadStep() {
      playedOnce = false;
      isRecording = false;
      const sentence = passage.sentences[sIdx];
      const tts = langByCode(profile.target_language).tts;
      document.getElementById('topLabel').textContent = planStepPrefix() + t('in.sentenceOfTotal', { i: sIdx + 1, n: passage.sentences.length });

      const showText = kind === 'reading';
      document.getElementById('readingBody').innerHTML = `
        <div class="lesson-body">
          ${renderProgress()}
          <span class="chip-mini">${kind === 'listening' ? t('in.listenSayBack') : t('in.readAloud')}</span>
          <div class="card" style="margin-top:14px;min-height:90px;display:flex;align-items:center;justify-content:center;text-align:center;">
            ${showText
              ? `<p style="font-size:19px;font-weight:700;font-family:var(--font-display);">${sentence.target}</p>`
              : `<div id="listenSlot">
                   <button class="btn-primary" id="playBtn">${t('in.playSentence')}</button>
                   <p class="text-faint" style="font-size:11.5px;margin-top:10px;">${t('in.tapPlayListen')}</p>
                 </div>`}
          </div>
          <div style="margin-top:28px;text-align:center;" id="micArea">
            ${micSupported ? `
              <button class="mic-btn" id="micBtn" ${showText ? '' : 'disabled'}>${icon('mic')}</button>
              <p class="text-faint" style="font-size:12px;margin-top:10px;" id="micHint">${showText ? t('in.tapAndRead') : t('in.playFirst')}</p>
            ` : `
              <button class="btn-primary" id="skipMicBtn">${t('in.continueArrow')}</button>
              <p class="text-faint" style="font-size:11.5px;margin-top:10px;">${t('in.pronScoringUnavailable')}</p>
            `}
          </div>
        </div>`;

      if (!showText) {
        document.getElementById('playBtn').addEventListener('click', () => {
          speak(sentence.target, tts);
          playedOnce = true;
          const micBtn = document.getElementById('micBtn');
          if (micBtn) {
            micBtn.disabled = false;
            document.getElementById('micHint').textContent = t('in.nowTapSay');
          }
        });
      }

      if (micSupported) {
        document.getElementById('micBtn').addEventListener('click', () => {
          const micBtn = document.getElementById('micBtn');
          const hint = document.getElementById('micHint');
          toggleRecording(micBtn, hint, sentence.target, (transcript, audioURL) => gradePronunciation(sentence.target, transcript, audioURL));
        });
      } else {
        document.getElementById('skipMicBtn').addEventListener('click', () => {
          sentenceResults[sIdx] = { pronScore: null, pronFeedback: null };
          renderComprehendStep();
        });
      }
    }

    async function toggleRecording(micBtn, hint, targetText, onGraded) {
      if (isRecording) {
        stopRecording();
        return;
      }
      await startRecording(micBtn, hint, targetText, onGraded);
    }

    async function startRecording(micBtn, hint, targetText, onGraded) {
      const tts = langByCode(profile.target_language).tts;
      audioChunks = [];
      liveTranscript = '';
      activeMicBtn = micBtn;
      activeHint = hint;
      activeTargetText = targetText;
      activeOnGraded = onGraded;

      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      } catch (e) {
        hint.textContent = t('in.micPermissionError');
        return;
      }

      mediaRecorder = new MediaRecorder(mediaStream);
      mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data); };
      mediaRecorder.start();

      recognition = new SR();
      recognition.lang = tts;
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.maxAlternatives = 1;
      recognition.onresult = (e) => {
        let tr = '';
        for (let i = 0; i < e.results.length; i++) tr += e.results[i][0].transcript;
        liveTranscript = tr;
      };
      recognition.onerror = () => {};
      recognition.start();

      isRecording = true;
      micBtn.classList.add('recording');
      micBtn.innerHTML = icon('mic');
      hint.textContent = t('in.recordingTapStop');
    }

    function stopRecording() {
      const micBtn = activeMicBtn;
      const hint = activeHint;
      const targetText = activeTargetText;
      const onGraded = activeOnGraded;
      isRecording = false;
      micBtn.classList.remove('recording');
      micBtn.innerHTML = icon('mic');
      micBtn.disabled = true;
      hint.textContent = t('in.processing');

      let recognitionDone = false, recorderDone = false, audioURL = null;
      const maybeFinish = () => {
        if (recognitionDone && recorderDone) onGraded(liveTranscript, audioURL);
      };

      if (recognition) {
        recognition.onend = () => { recognitionDone = true; maybeFinish(); };
        try { recognition.stop(); } catch (e) { recognitionDone = true; maybeFinish(); }
      } else {
        recognitionDone = true;
      }

      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.onstop = () => {
          const blob = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
          audioURL = URL.createObjectURL(blob);
          if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
          recorderDone = true;
          maybeFinish();
        };
        try { mediaRecorder.stop(); } catch (e) { recorderDone = true; maybeFinish(); }
      } else {
        recorderDone = true;
      }
    }

    async function gradePronunciation(targetSentence, transcript, audioURL) {
      document.getElementById('micArea').innerHTML = `
        <div class="lesson-center" style="padding:10px 0;">
          <div id="mascotSlot" style="width:36px;"></div>
          <p class="text-dim" style="margin-top:10px;font-size:13px;">${t('in.gradingReading')}</p>
        </div>`;
      document.getElementById('mascotSlot').innerHTML = mascotHTML(36);

      let result;
      try {
        const token = await getAuthToken();
        const res = await fetch(GRADE_PRONUNCIATION_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body: JSON.stringify({
            targetSentence,
            transcript,
            targetLanguage: langByCode(profile.target_language).name,
            nativeLanguage: profile.native_language,
          }),
        });
        const raw = await res.text();
        const data = JSON.parse(raw);
        if (!res.ok || data.error) throw new Error(data.error || ('HTTP ' + res.status));
        result = data;
      } catch (e) {
        result = { score: null, isGood: null, feedback: "Couldn't reach the grader (" + (e.message || 'error') + '). Moving on.', missedWords: [] };
      }

      const missedWords = Array.isArray(result.missedWords) ? result.missedWords : [];
      sentenceResults[sIdx] = {
        pronScore: result.score,
        pronFeedback: result.feedback,
        heard: transcript,
        audioURL,
        missedWords,
        wordPractice: {},
      };
      renderPronFeedback();

      if (missedWords.length) recordPronunciationMistakes(user.id, profile.target_language, missedWords, targetSentence);
    }

    async function gradeWordPronunciation(word, transcript, audioURL, words, tts) {
      const r = sentenceResults[sIdx];
      let result;
      try {
        const token = await getAuthToken();
        const res = await fetch(GRADE_PRONUNCIATION_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body: JSON.stringify({
            targetSentence: word,
            transcript,
            targetLanguage: langByCode(profile.target_language).name,
            nativeLanguage: profile.native_language,
          }),
        });
        const raw = await res.text();
        const data = JSON.parse(raw);
        if (!res.ok || data.error) throw new Error(data.error || ('HTTP ' + res.status));
        result = data;
      } catch (e) {
        result = { score: null, isGood: null, feedback: '' };
      }
      r.wordPractice[word] = { score: result.score, audioURL };
      renderWordPracticeList(words, tts);
    }

    function renderPronFeedback() {
      const sentence = passage.sentences[sIdx];
      const r = sentenceResults[sIdx];
      const tts = langByCode(profile.target_language).tts;
      const good = r.pronScore === null ? null : r.pronScore >= 75;
      const missedWords = (r.missedWords || []).slice(0, 4);
      document.getElementById('readingBody').innerHTML = `
        <div class="lesson-body">
          ${renderProgress()}
          <div style="display:flex;align-items:center;gap:14px;">
            ${r.pronScore !== null ? `<div class="score-badge ${good ? 'good' : 'bad'}">${r.pronScore}</div>` : ''}
            <div>
              <p style="font-weight:800;">${r.pronScore === null ? t('in.skipped') : good ? t('in.niceReading') : t('in.worthAnotherLook')}</p>
              <p class="text-dim" style="font-size:13px;margin-top:2px;">${r.pronFeedback || ''}</p>
            </div>
          </div>
          <div class="card" style="margin-top:16px;">
            <p style="font-size:16px;font-weight:700;font-family:var(--font-display);">${sentence.target}</p>
            ${r.heard ? `<p class="text-faint" style="font-size:12px;margin-top:8px;">${t('in.weHeard')} "${r.heard}"</p>` : ''}
          </div>
          <div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;">
            <button class="btn-ghost" id="hearCorrectBtn">${t('in.hearCorrect')}</button>
            ${r.audioURL ? `<button class="btn-ghost" id="hearMineBtn">${t('in.hearMine')}</button>` : ''}
          </div>
          ${missedWords.length ? `
            <div class="card" style="margin-top:18px;">
              <span class="label" style="margin-bottom:4px;">${t('in.wordsToPractice')}</span>
              <div id="wordPracticeList"></div>
            </div>` : ''}
          <div style="display:flex;gap:10px;margin-top:22px;">
            <button class="btn-ghost" id="retryReadBtn">${t('in.retry')}</button>
            <button class="btn-primary" id="toComprehendBtn" style="flex:1;justify-content:center;">${t('in.continueArrow')}</button>
          </div>
        </div>`;
      document.getElementById('hearCorrectBtn').addEventListener('click', () => speak(sentence.target, tts));
      if (r.audioURL) {
        document.getElementById('hearMineBtn').addEventListener('click', () => { new Audio(r.audioURL).play(); });
      }
      document.getElementById('retryReadBtn').addEventListener('click', renderReadStep);
      document.getElementById('toComprehendBtn').addEventListener('click', renderComprehendStep);

      if (missedWords.length) renderWordPracticeList(missedWords, tts);
    }

    function renderWordPracticeList(words, tts) {
      const r = sentenceResults[sIdx];
      const list = document.getElementById('wordPracticeList');
      if (!list) return;
      list.innerHTML = words.map((w, i) => {
        const wp = r.wordPractice[w];
        const passed = wp && wp.score !== null && wp.score >= 75;
        const scoreNote = passed
          ? `<span class="text-faint" style="font-size:11.5px;color:var(--mint);">${icon('check', { size: 11 })} ${t('in.wordPassed')}</span>`
          : (wp && wp.score !== null ? `<span class="text-faint" style="font-size:11.5px;">${wp.score}</span>` : '');
        return `
          <div class="word-practice-row">
            <div style="display:flex;align-items:center;gap:8px;flex:1;min-width:0;">
              <span style="font-weight:700;font-family:var(--font-display);font-size:15px;">${w}</span>
              ${scoreNote}
            </div>
            <div style="display:flex;align-items:center;gap:6px;">
              <button class="btn-ghost" data-word-hear="${i}" style="padding:4px 10px;font-size:12px;">${icon('speaker', { size: 14 })}</button>
              ${micSupported ? `<button class="mic-btn-sm" data-word-mic="${i}">${icon('mic', { size: 14 })}</button>` : ''}
            </div>
          </div>
          ${micSupported ? `<p class="text-faint" id="wordHint${i}" style="font-size:11px;margin:2px 0 6px;">${t('in.wordRecordHint')}</p>` : ''}
        `;
      }).join('');

      words.forEach((w, i) => {
        list.querySelector(`[data-word-hear="${i}"]`).addEventListener('click', () => speak(w, tts));
        const micBtn = list.querySelector(`[data-word-mic="${i}"]`);
        if (micBtn) {
          const hint = document.getElementById('wordHint' + i);
          micBtn.addEventListener('click', () => {
            toggleRecording(micBtn, hint, w, (transcript, audioURL) => gradeWordPronunciation(w, transcript, audioURL, words, tts));
          });
        }
      });
    }

    function renderComprehendStep() {
      const sentence = passage.sentences[sIdx];
      document.getElementById('readingBody').innerHTML = `
        <div class="lesson-body">
          ${renderProgress()}
          <div class="card" style="margin-bottom:18px;">
            <p style="font-size:16px;font-weight:700;font-family:var(--font-display);">${sentence.target}</p>
          </div>
          <label class="label">${t('in.whatDoesMean', { lang: nativeLangDisplay(profile.native_language) })}</label>
          <textarea id="compInput" class="input" rows="3" style="resize:none;" placeholder="${t('in.typeHere')}"></textarea>
          <button class="btn-primary" id="compSubmitBtn" style="margin-top:18px;width:100%;justify-content:center;" disabled>${t('in.check')}</button>
          <div id="compFeedbackSlot" style="margin-top:16px;"></div>
        </div>`;

      const input = document.getElementById('compInput');
      const submitBtn = document.getElementById('compSubmitBtn');
      let submitted = false;
      input.addEventListener('input', () => { submitBtn.disabled = input.value.trim().length === 0; });
      submitBtn.addEventListener('click', async () => {
        if (submitted) { nextSentence(); return; }
        const answer = input.value.trim();
        submitBtn.disabled = true;
        submitBtn.textContent = t('in.checking');
        input.disabled = true;

        let result;
        try {
          const token = await getAuthToken();
          const res = await fetch(TRANSLATE_GRADE_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
            body: JSON.stringify({
              sourceText: sentence.target,
              expectedText: sentence.native,
              userAnswer: answer,
              targetLanguage: langByCode(profile.target_language).name,
              nativeLanguage: profile.native_language,
              grammarLabel: passage.title,
            }),
          });
          const raw = await res.text();
          const data = JSON.parse(raw);
          if (!res.ok || data.error) throw new Error(data.error || ('HTTP ' + res.status));
          result = data;
        } catch (e) {
          result = { isCorrect: null, feedback: "Couldn't reach the grader (" + (e.message || 'error') + '). Moving on.' };
        }

        submitted = true;
        sentenceResults[sIdx].comprehensionCorrect = result.isCorrect === true;
        if (result.isCorrect === true) fireConfetti('small');

        const good = result.isCorrect;
        document.getElementById('compFeedbackSlot').innerHTML = `
          <div class="feedback-box ${good === null ? '' : good ? 'correct' : 'wrong'}">
            <p style="font-weight:800;">${good === null ? t('in.skipped') : good ? t('in.gotIt') : t('in.notQuite')}</p>
            <p class="text-dim" style="font-size:13.5px;margin-top:4px;">${result.feedback || ''}</p>
            <p class="text-faint" style="font-size:12px;margin-top:8px;">${t('in.fullMeaning')} <b style="color:var(--text);">${sentence.native}</b></p>
          </div>
          ${grammarLessonHTML(result)}`;
        saveGrammarLesson(user.id, profile.target_language, profile.current_level, result);

        submitBtn.disabled = false;
        submitBtn.textContent = sIdx + 1 < passage.sentences.length ? t('in.nextSentence') : t('in.finish');
      });
    }

    function nextSentence() {
      if (sIdx + 1 < passage.sentences.length) { sIdx++; renderReadStep(); }
      else finish();
    }

    async function finish() {
      const scored = sentenceResults.filter(r => r.pronScore !== null && r.pronScore !== undefined);
      const avgPron = scored.length ? Math.round(scored.reduce((s, r) => s + r.pronScore, 0) / scored.length) : null;
      const compCorrect = sentenceResults.filter(r => r.comprehensionCorrect).length;
      const total = sentenceResults.length;
      const perfect = total > 0 && compCorrect === total && (avgPron === null || avgPron >= 100);
      const xpEarned = 15 + compCorrect * 8 + (avgPron !== null ? Math.round(avgPron / 10) : 0);

      document.getElementById('topLabel').textContent = '';
      document.getElementById('readingBody').innerHTML = `
        <div class="lesson-center">
          <div style="color:${perfect ? 'var(--mint)' : 'var(--dark)'};">${icon(perfect ? 'confetti' : 'trophy', { size: 40 })}</div>
          <h2 style="font-size:24px;margin:14px 0 4px;">${t('in.niceWorkTitle')}</h2>
          <p class="text-dim" style="font-size:14.5px;">${t('in.understoodOfTotal', { c: compCorrect, t: total })}${avgPron !== null ? ` · ${t('in.pronAvg', { n: avgPron })}` : ''}</p>
          <div id="levelUpSlot" style="width:100%;"></div>
          <button class="btn-primary" id="doneBtn" style="margin-top:20px;">${planCtx ? t('pl.continuePlan') : t('in.backToHome')}</button>
        </div>`;
      document.getElementById('doneBtn').addEventListener('click', () => {
        if (planCtx) { window.location.href = advancePlanAndGetNextUrl(planCtx.plan, xpEarned); }
        else { window.location.href = 'dashboard.html'; }
      });
      if (perfect) fireConfetti('big');

      if (passageId) {
        await db.from('reading_completions').insert({
          user_id: user.id, passage_id: passageId, score: compCorrect, xp_earned: xpEarned, pronunciation_avg: avgPron, mode: 'intensive',
        });
      }
      await updateStreakAndActivity(user, profile, xpEarned, 'reading');

      const levelUp = await recordActivityAndMaybeEvaluate(user, profile);
      const newBadges = await checkAndAwardBadges(user, profile);
      document.getElementById('levelUpSlot').innerHTML = (levelUp ? celebrationHTML(levelUp) : '') + badgesEarnedHTML(newBadges);
    }

    document.getElementById('exitBtn').addEventListener('click', () => {
      stopPlayback();
      if (recognition) { try { recognition.stop(); } catch (e) {} }
      if (mediaRecorder && mediaRecorder.state !== 'inactive') { try { mediaRecorder.stop(); } catch (e) {} }
      if (mediaStream) { try { mediaStream.getTracks().forEach(t => t.stop()); } catch (e) {} }
      window.location.href = 'dashboard.html';
    });

    (async () => {
      user = await requireAuth();
      if (!user) return;
      profile = await getProfile(user.id);
      if (!profile || !profile.name) { window.location.href = 'onboarding.html'; return; }
      setLocale(profile.native_language);
      planCtx = isPlanStepActive('reading');
      document.getElementById('topLabel').textContent = '';
      if (planCtx) {
        // Plan mode skips the topic picker and mode/kind pickers,
        // randomizing both for variety (mirrors the old input.html's
        // reading/listening randomization, now extended to extensive vs
        // intensive too).
        sessionTopic = pickTopicForSession(getLastTopics(profile));
        mode = Math.random() < 0.5 ? 'extensive' : 'intensive';
        kind = mode === 'intensive' ? (Math.random() < 0.5 ? 'reading' : 'listening') : null;
        loadPassage();
      } else {
        renderTopicPicker(document.getElementById('readingBody'), {
          initial: getLastTopics(profile),
          onStart: async (selection) => {
            await saveLastTopics(user.id, selection);
            sessionTopic = pickTopicForSession(selection);
            renderModePicker();
          },
        });
      }
    })();
  </script>
