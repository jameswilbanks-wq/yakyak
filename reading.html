<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YakYak — Reading Library</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="lesson-wrap">
    <div class="lesson-top">
      <div style="display:flex;align-items:center;gap:8px;">
        <div class="mascot" style="width:20px;height:20px;">
          <div class="eyes" style="gap:3.6px;"><div class="eye" style="width:2px;height:2px;"></div><div class="eye" style="width:2px;height:2px;"></div></div>
          <div class="smile" style="bottom:4.8px;width:5.6px;height:2.8px;border-bottom-width:2px;"></div>
        </div>
        <button class="icon-btn" id="exitBtn">✕</button>
      </div>
      <span class="text-faint" id="topLabel" style="font-size:12.5px;"></span>
    </div>
    <div id="readingBody"></div>
  </div>

  <script src="supabase-client.js"></script>
  <script src="i18n.js"></script>
  <script>
    let user = null, profile = null, passage = null, passageId = null, sessionTopic = null;
    let qIdx = 0, results = [];

    // Playback state for the read-along player. Speed and the translation
    // toggle are remembered per-device via localStorage since they're pure
    // display preferences, not anything that needs to sync across devices.
    const READING_RATE = { normal: 0.95, slow: 0.6 };
    let speed = localStorage.getItem('yakyak_reading_speed') || 'normal';
    let translationOn = localStorage.getItem('yakyak_reading_translation') === '1';
    let isPlaying = false;
    let stopRequested = false;

    function renderLoading() {
      document.getElementById('readingBody').innerHTML = `
        <div class="lesson-center">
          <div id="mascotSlot" style="width:52px;"></div>
          <p class="text-dim" style="margin-top:16px;font-size:14.5px;">${t('rl.building')}</p>
        </div>`;
      document.getElementById('mascotSlot').innerHTML = mascotHTML(52);
    }

    function renderError(message) {
      document.getElementById('readingBody').innerHTML = `
        <div class="lesson-center error-box">
          <div style="font-size:30px;">⚠️</div>
          <p style="font-weight:700;">${t('rl.couldntBuild')}</p>
          <p class="text-faint" style="font-size:12.5px;max-width:320px;">${message}</p>
          <button class="btn-primary" id="retryBtn" style="margin-top:8px;">${t('ls.tryAgain')}</button>
        </div>`;
      document.getElementById('retryBtn').addEventListener('click', loadPassage);
    }

    async function loadPassage() {
      renderLoading();
      try {
        const avoid = await fetchRecentValues('reading_passages', 'title', profile.target_language, profile.current_level, 8);
        const token = await getAuthToken();
        const res = await fetch(GENERATE_EXTENSIVE_PASSAGE_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body: JSON.stringify({
            targetLanguage: langByCode(profile.target_language).name,
            nativeLanguage: profile.native_language,
            level: profile.current_level,
            interest: sessionTopic || 'daily life',
            angle: randomAngle(),
            avoid,
          }),
        });
        const raw = await res.text();
        if (!raw) throw new Error('Empty response (HTTP ' + res.status + ')');
        const data = JSON.parse(raw);
        if (!res.ok || data.error) throw new Error(data.error || ('HTTP ' + res.status));
        if (!data.sentences || !data.sentences.length || !data.questions || !data.questions.length) throw new Error('No passage returned');
        passage = data;

        const { data: row } = await db.from('reading_passages').insert({
          target_language: profile.target_language,
          native_language: profile.native_language,
          level: profile.current_level,
          title: data.title,
          body: data.body,
          comprehension_questions: data.questions,
          interest_tag: sessionTopic || null,
        }).select('id').single();
        passageId = row ? row.id : null;

        renderPassage();
      } catch (e) {
        renderError(e.message || 'Unknown error');
      }
    }

    // --- Read-along player: per-sentence TTS with live word highlighting ---
    // One SpeechSynthesisUtterance per sentence (not the whole passage) so
    // the browser's onboundary word-timing events stay reliable, and so a
    // learner can replay just one sentence. Highlighting quality depends on
    // the browser/voice actually firing word boundaries (Chrome does;
    // support elsewhere varies) — if it doesn't fire, the sentence still
    // reads aloud fine, it just won't visibly highlight.

    function escapeHtml(str) {
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function sentenceToSpansHTML(text) {
      let html = '';
      let last = 0;
      const regex = /\S+/g;
      let m;
      while ((m = regex.exec(text))) {
        html += escapeHtml(text.slice(last, m.index));
        html += `<span class="rl-word" data-start="${m.index}">${escapeHtml(m[0])}</span>`;
        last = m.index + m[0].length;
      }
      html += escapeHtml(text.slice(last));
      return html;
    }

    // Chunk-aware version of the above: instead of one plain target string,
    // each sentence now carries aligned {target, native} chunks (word- or
    // short-phrase-level — see generate-extensive-passage v3). This wraps
    // each chunk of the TARGET side in a "rl-chunk" span (itself containing
    // "rl-word" spans, still individually addressable so the existing TTS
    // onboundary highlighter keeps working untouched) and each chunk of the
    // NATIVE side in a matching "rl-chunk" span. Both sides share a
    // data-align id per chunk, which is all wireChunkHover() needs to bump
    // the right pair on hover. Word char-offsets are computed against the
    // same single-space-joined string the server built sentence.target
    // from, so TTS highlighting lines up exactly.
    function sentenceToChunkedSpansHTML(chunks, sIdx) {
      let charPos = 0;
      const targetParts = [];
      const nativeParts = [];
      chunks.forEach((c, cIdx) => {
        if (cIdx > 0) charPos += 1; // the joining space between chunks
        const alignId = `s${sIdx}-c${cIdx}`;
        let wordsHTML = '';
        let lastLocal = 0;
        const wordRe = /\S+/g;
        let m;
        while ((m = wordRe.exec(c.target))) {
          wordsHTML += escapeHtml(c.target.slice(lastLocal, m.index));
          wordsHTML += `<span class="rl-word" data-start="${charPos + m.index}">${escapeHtml(m[0])}</span>`;
          lastLocal = m.index + m[0].length;
        }
        wordsHTML += escapeHtml(c.target.slice(lastLocal));
        targetParts.push(`<span class="rl-chunk" data-align="${alignId}">${wordsHTML}</span>`);
        nativeParts.push(`<span class="rl-chunk" data-align="${alignId}">${escapeHtml(c.native || '')}</span>`);
        charPos += c.target.length;
      });
      return { targetHTML: targetParts.join(' '), nativeHTML: nativeParts.join(' ') };
    }

    // Groups every .rl-chunk in the current render by its data-align id
    // (at most 2 elements per group: the target-side chunk and, if the
    // translation line is showing, its native-side match) and wires hover
    // so entering either bumps/bolds both. Call after every re-render.
    function wireChunkHover() {
      const groups = {};
      document.querySelectorAll('.rl-chunk').forEach(el => {
        (groups[el.dataset.align] = groups[el.dataset.align] || []).push(el);
      });
      Object.values(groups).forEach(els => {
        els.forEach(el => {
          el.addEventListener('mouseenter', () => els.forEach(e => e.classList.add('rl-chunk-hover')));
          el.addEventListener('mouseleave', () => els.forEach(e => e.classList.remove('rl-chunk-hover')));
        });
      });
    }

    function highlightWordAt(sentenceEl, charIndex) {
      const spans = sentenceEl.querySelectorAll('.rl-word');
      let target = null;
      spans.forEach(s => {
        s.style.background = 'transparent';
        if (parseInt(s.dataset.start, 10) <= charIndex) target = s;
      });
      if (target) { target.style.background = 'var(--mint-soft)'; target.style.borderRadius = '4px'; }
    }

    function clearHighlight(sentenceEl) {
      sentenceEl.querySelectorAll('.rl-word').forEach(s => { s.style.background = 'transparent'; });
    }

    function updatePlayButtonLabel() {
      const btn = document.getElementById('playAllBtn');
      if (btn) btn.textContent = isPlaying ? ('⏸ ' + t('rl.stop')) : ('▶ ' + t('rl.playAll'));
    }

    function stopPlayback() {
      stopRequested = true;
      isPlaying = false;
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      updatePlayButtonLabel();
    }

    function playSentence(idx, onEnd) {
      const s = passage.sentences[idx];
      const sentenceEl = document.querySelector(`.rl-sentence[data-idx="${idx}"]`);
      if (!('speechSynthesis' in window) || !sentenceEl || !s) { onEnd(); return; }
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(s.target);
      u.lang = langByCode(profile.target_language).tts;
      u.rate = READING_RATE[speed] || 0.95;
      u.onboundary = (e) => { if (!e.name || e.name === 'word') highlightWordAt(sentenceEl, e.charIndex); };
      u.onend = () => { clearHighlight(sentenceEl); onEnd(); };
      u.onerror = () => { clearHighlight(sentenceEl); onEnd(); };
      window.speechSynthesis.speak(u);
    }

    function playAll() {
      isPlaying = true;
      stopRequested = false;
      updatePlayButtonLabel();
      const step = (idx) => {
        if (stopRequested || idx >= passage.sentences.length) { isPlaying = false; stopRequested = false; updatePlayButtonLabel(); return; }
        playSentence(idx, () => step(idx + 1));
      };
      step(0);
    }

    function renderPassage() {
      document.getElementById('topLabel').textContent = t('rl.freeReading');
      const sentencesHTML = passage.sentences.map((s, i) => {
        const { targetHTML, nativeHTML } = sentenceToChunkedSpansHTML(s.chunks || [], i);
        return `
        ${s.newParagraph && i > 0 ? '<div style="height:14px;"></div>' : ''}
        <div class="rl-sentence" data-idx="${i}" style="margin-bottom:${translationOn ? '14px' : '4px'};">
          <div style="display:flex;align-items:baseline;gap:8px;">
            <button class="icon-btn icon-btn-sm rl-sentence-play" data-idx="${i}" style="flex-shrink:0;">🔊</button>
            <span style="font-size:15.5px;line-height:1.8;">${targetHTML}</span>
          </div>
          ${translationOn ? `<div class="text-faint" style="font-size:12.5px;line-height:1.6;margin-left:34px;margin-top:2px;">${nativeHTML}</div>` : ''}
        </div>`;
      }).join('');

      document.getElementById('readingBody').innerHTML = `
        <div class="lesson-body">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px;">
            <button class="btn-ghost" id="playAllBtn" style="padding:6px 12px;">▶ ${t('rl.playAll')}</button>
            <button class="chip${speed === 'normal' ? ' active' : ''}" data-speed="normal" style="padding:4px 10px;font-size:12px;">${t('rl.speedNormal')}</button>
            <button class="chip${speed === 'slow' ? ' active' : ''}" data-speed="slow" style="padding:4px 10px;font-size:12px;">${t('rl.speedSlow')}</button>
            <button class="chip${translationOn ? ' active' : ''}" id="translationToggle" style="padding:4px 10px;font-size:12px;margin-left:auto;">${translationOn ? t('rl.hideTranslation') : t('rl.showTranslation')}</button>
          </div>
          <p class="text-faint" style="font-size:11px;margin-bottom:10px;">${t('rl.hoverHint')}</p>
          <h1 style="font-size:19px;font-family:var(--font-display);margin-bottom:10px;">${passage.title}</h1>
          <div class="card">${sentencesHTML}</div>
          ${passage.glossary && passage.glossary.length ? `
            <div class="card" style="margin-top:14px;">
              <span class="label" style="margin-bottom:6px;">${t('rl.glossary')}</span>
              <div style="display:flex;flex-direction:column;gap:6px;">
                ${passage.glossary.map(g => `<div style="display:flex;gap:8px;font-size:13px;"><b style="font-family:var(--font-display);">${g.term}</b><span class="text-dim">— ${g.meaning}</span></div>`).join('')}
              </div>
            </div>` : ''}
          <button class="btn-primary" id="doneReadingBtn" style="margin-top:20px;width:100%;justify-content:center;">${t('rl.doneReading')}</button>
        </div>`;

      updatePlayButtonLabel();
      document.getElementById('playAllBtn').addEventListener('click', () => { isPlaying ? stopPlayback() : playAll(); });
      document.querySelectorAll('[data-speed]').forEach(b => b.addEventListener('click', () => {
        speed = b.dataset.speed;
        localStorage.setItem('yakyak_reading_speed', speed);
        stopPlayback();
        renderPassage();
      }));
      document.getElementById('translationToggle').addEventListener('click', () => {
        translationOn = !translationOn;
        localStorage.setItem('yakyak_reading_translation', translationOn ? '1' : '0');
        stopPlayback();
        renderPassage();
      });
      document.querySelectorAll('.rl-sentence-play').forEach(b => b.addEventListener('click', () => {
        stopPlayback();
        playSentence(parseInt(b.dataset.idx, 10), () => {});
      }));
      document.getElementById('doneReadingBtn').addEventListener('click', () => { stopPlayback(); startQuestions(); });
      wireChunkHover();
    }

    function startQuestions() {
      qIdx = 0;
      results = [];
      renderQuestion();
    }

    function renderQuestion() {
      const q = passage.questions[qIdx];
      document.getElementById('topLabel').textContent = `${t('rl.comprehension')} · ${qIdx + 1}/${passage.questions.length}`;
      document.getElementById('readingBody').innerHTML = `
        <div class="lesson-body">
          <h2 style="font-size:18px;margin-bottom:16px;">${q.question}</h2>
          <div style="display:flex;flex-direction:column;gap:10px;" id="optionsList"></div>
          <div id="nextQBtn"></div>
        </div>`;
      const list = document.getElementById('optionsList');
      list.innerHTML = q.options.map((opt, i) => `<button class="option" data-i="${i}">${opt}</button>`).join('');
      list.querySelectorAll('.option').forEach(btn => {
        btn.addEventListener('click', () => {
          const chosen = parseInt(btn.dataset.i);
          const correct = chosen === q.answerIndex;
          results.push(correct);
          list.querySelectorAll('.option').forEach(b => {
            b.disabled = true;
            if (parseInt(b.dataset.i) === q.answerIndex) b.classList.add('correct');
            else if (b === btn) b.classList.add('wrong');
          });
          document.getElementById('nextQBtn').innerHTML = `<button class="btn-primary" id="nextBtn" style="margin-top:20px;width:100%;justify-content:center;">${qIdx + 1 < passage.questions.length ? t('rl.nextQuestion') : t('rl.finish')}</button>`;
          document.getElementById('nextBtn').addEventListener('click', () => {
            if (qIdx + 1 < passage.questions.length) { qIdx++; renderQuestion(); }
            else finishSession();
          });
        });
      });
    }

    async function finishSession() {
      const correctCount = results.filter(Boolean).length;
      const xpEarned = 12 + correctCount * 5;

      document.getElementById('topLabel').textContent = '';
      document.getElementById('readingBody').innerHTML = `
        <div class="lesson-center">
          <div style="font-size:40px;">${correctCount === results.length ? '🎉' : '📖'}</div>
          <h2 style="font-size:24px;margin:14px 0 4px;">${t('rl.passageComplete')}</h2>
          <p class="text-dim" style="font-size:14.5px;">${t('rl.correctOfTotal', { c: correctCount, t: results.length })}</p>
          <div id="levelUpSlot" style="width:100%;"></div>
          <button class="btn-primary" id="doneBtn" style="margin-top:20px;">${t('rl.backToHome')}</button>
        </div>`;
      document.getElementById('doneBtn').addEventListener('click', () => { window.location.href = 'dashboard.html'; });

      if (passageId) {
        await db.from('reading_completions').insert({
          user_id: user.id, passage_id: passageId, score: correctCount, xp_earned: xpEarned,
        });
      }

      await updateStreakAndActivity(user, profile, xpEarned, 'reading');

      const levelUp = await recordActivityAndMaybeEvaluate(user, profile);
      const newBadges = await checkAndAwardBadges(user, profile);
      document.getElementById('levelUpSlot').innerHTML = (levelUp ? celebrationHTML(levelUp) : '') + badgesEarnedHTML(newBadges);
    }

    document.getElementById('exitBtn').addEventListener('click', () => { stopPlayback(); window.location.href = 'dashboard.html'; });

    (async () => {
      user = await requireAuth();
      if (!user) return;
      profile = await getProfile(user.id);
      if (!profile || !profile.name) { window.location.href = 'onboarding.html'; return; }
      setLocale(profile.native_language);
      document.getElementById('topLabel').textContent = '';
      renderTopicPicker(document.getElementById('readingBody'), {
        initial: getLastTopics(profile),
        onStart: async (selection) => {
          await saveLastTopics(user.id, selection);
          sessionTopic = pickTopicForSession(selection);
          loadPassage();
        },
      });
    })();
  </script>
</body>
</html>
