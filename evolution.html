<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YakYak — Yak Evolution</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="lesson-wrap">
    <div class="lesson-top">
      <div style="display:flex;align-items:center;gap:8px;">
        <div class="mascot" style="width:20px;height:20px;">
          <div class="eyes" style="gap:3.6px;"><div class="eye" style="width:2px;height:2px;"></div><div class="eye" style="width:2px;height:2px;"></div></div>
          <div class="smile" style="bottom:4.8px;width:5.6px;height:2.8px;border-bottom-width:2px;"></div>
        </div>
        <button class="icon-btn" id="exitBtn">✕</button>
      </div>
      <span class="text-faint" id="topLabel" style="font-size:12.5px;"></span>
    </div>
    <div id="evoBody"></div>
  </div>

  <script src="supabase-client.js"></script>
  <script src="i18n.js"></script>
  <script>
    // Yak Evolution: nobody picks their avatar anymore — it's earned. This
    // page is the "why bother" pitch: show the whole 10-stage ladder up
    // front (including stages the learner hasn't reached, deliberately
    // grayed out rather than hidden, so the mythic end state is visible
    // from day one), plus a "you are here" callout with a live progress bar
    // to the next unlock. See YAK_EVOLUTION / currentEvolutionStage /
    // nextEvolutionStage in supabase-client.js for the underlying data —
    // this file is purely a renderer over that shared source of truth.
    let user = null, profile = null, myBadgeCodes = [];

    function renderLoading() {
      document.getElementById('evoBody').innerHTML = `
        <div class="lesson-center">
          <div id="mascotSlot" style="width:52px;"></div>
        </div>`;
      document.getElementById('mascotSlot').innerHTML = mascotHTML(52);
    }

    function render() {
      const xp = profile.xp || 0;
      const current = currentEvolutionStage(xp);
      const next = nextEvolutionStage(xp);

      document.getElementById('topLabel').textContent = t('ev.title');
      document.getElementById('evoBody').innerHTML = `
        <div class="lesson-body">
          <h1 style="font-size:23px;font-family:var(--font-display);">${t('ev.title')}</h1>
          <p class="text-dim" style="font-size:13.5px;margin-top:4px;margin-bottom:20px;">${t('ev.subtitle')}</p>

          <div class="card" id="heroCard" style="text-align:center;padding:24px 20px;"></div>

          <div style="margin-top:26px;display:flex;flex-direction:column;gap:10px;" id="ladderList"></div>
        </div>`;

      // --- "You are here" hero -------------------------------------------
      const heroCard = document.getElementById('heroCard');
      const progressPct = next
        ? Math.max(4, Math.min(100, Math.round(((xp - current.minXp) / (next.minXp - current.minXp)) * 100)))
        : 100;
      heroCard.innerHTML = `
        <div style="display:flex;justify-content:center;">${yakAvatarHTML(current.avatarId, 96, myBadgeCodes)}</div>
        <span class="chip-mini" style="margin:14px auto 2px;">${t('ev.levelLabel', { n: current.level })}</span>
        <h2 style="font-size:21px;margin:6px 0 2px;font-family:var(--font-display);">${current.title}</h2>
        <p class="text-faint" style="font-size:12.5px;text-transform:uppercase;letter-spacing:.08em;">${current.tagline}</p>
        <p class="text-dim" style="font-size:13.5px;margin-top:12px;max-width:340px;margin-left:auto;margin-right:auto;line-height:1.5;">${current.desc}</p>
        <div style="margin-top:18px;">
          ${next ? `
            <div style="display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:6px;" class="text-faint">
              <span>✨ ${xp} XP</span>
              <span>${t('ev.toGo', { n: Math.max(0, next.minXp - xp) })}</span>
            </div>
            <div style="height:8px;border-radius:999px;background:var(--card-2);overflow:hidden;">
              <div style="height:100%;width:${progressPct}%;border-radius:999px;background:var(--accent);transition:width .3s ease;"></div>
            </div>
            <p class="text-faint" style="font-size:11px;margin-top:8px;">${t('ev.nextUp', { title: next.title })}</p>
          ` : `
            <p class="text-faint" style="font-size:12px;">${t('ev.maxedOut')}</p>
          `}
        </div>`;

      // --- Full ladder, level 1 → 10 ---------------------------------
      document.getElementById('ladderList').innerHTML = YAK_EVOLUTION.map(stage => {
        const reached = xp >= stage.minXp;
        const isCurrent = stage.level === current.level;
        const xpNote = reached
          ? t('ev.reached')
          : t('ev.xpNeeded', { n: stage.minXp });
        return `
          <div class="card" style="display:flex;align-items:center;gap:14px;padding:12px 14px;${isCurrent ? 'border-color:var(--accent);' : ''}">
            <div style="flex-shrink:0;${reached ? '' : 'filter:grayscale(1);opacity:.4;'}">
              ${yakAvatarHTML(stage.avatarId, 52, [])}
            </div>
            <div style="flex:1;min-width:0;">
              <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
                <span style="font-weight:800;font-size:14px;${reached ? '' : 'color:var(--text-faint);'}">${t('ev.levelLabel', { n: stage.level })} · ${stage.title}</span>
                ${isCurrent ? `<span class="chip-mini" style="background:var(--mint-soft);color:var(--mint);">${t('ev.youAreHere')}</span>` : ''}
              </div>
              <div class="text-faint" style="font-size:11.5px;margin-top:1px;text-transform:uppercase;letter-spacing:.06em;">${stage.tagline}</div>
              <div class="text-dim" style="font-size:12px;margin-top:4px;line-height:1.45;${reached ? '' : 'opacity:.75;'}">${stage.desc}</div>
            </div>
            <div style="flex-shrink:0;text-align:right;font-size:11px;font-weight:700;color:${reached ? 'var(--mint)' : 'var(--text-faint)'};white-space:nowrap;">
              ${reached ? '✓ ' : ''}${xpNote}
            </div>
          </div>`;
      }).join('');
    }

    document.getElementById('exitBtn').addEventListener('click', () => { window.location.href = 'dashboard.html'; });

    (async () => {
      user = await requireAuth();
      if (!user) return;
      profile = await getProfile(user.id);
      if (!profile || !profile.name) { window.location.href = 'onboarding.html'; return; }
      setLocale(profile.native_language);
      renderLoading();
      const { data: myBadges } = await db.from('user_badges').select('badge_code').eq('user_id', user.id);
      myBadgeCodes = (myBadges || []).map(b => b.badge_code);
      render();
    })();
  </script>
</body>
</html>
