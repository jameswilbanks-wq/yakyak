<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YakYak — Talk</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="lesson-wrap">
    <div class="lesson-top">
      <button class="icon-btn" id="exitBtn">✕</button>
      <span class="text-faint" id="topLabel" style="font-size:12.5px;"></span>
    </div>
    <div id="roleplayBody" style="flex:1;display:flex;flex-direction:column;min-height:0;"></div>
  </div>

  <script src="supabase-client.js"></script>
  <script src="i18n.js"></script>
  <script>
    let maxTurns = 12;
    let user = null, profile = null, scenarios = [], scenario = null, sessionId = null, sessionTopic = null;
    let transcript = [], turnCount = 0, goalCompleted = false, grammarFlagged = [], busy = false;
    let planCtx = null; // { plan, step } if running as a lesson-plan step, else null

    function planStepPrefix() {
      if (!planCtx) return '';
      return t('pl.stepOfTotal', { i: planCtx.plan.currentIndex + 1, n: planCtx.plan.steps.length });
    }

    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    const micSupported = !!SR;
    let recognition = null, isRecording = false;

    function renderLoading(message) {
      document.getElementById('roleplayBody').innerHTML = `
        <div class="lesson-center">
          <div id="mascotSlot" style="width:52px;"></div>
          <p class="text-dim" style="margin-top:16px;font-size:14.5px;">${message}</p>
        </div>`;
      document.getElementById('mascotSlot').innerHTML = mascotHTML(52);
    }

    function renderError(message, retryFn) {
      document.getElementById('roleplayBody').innerHTML = `
        <div class="lesson-center error-box">
          <div style="font-size:30px;">⚠️</div>
          <p style="font-weight:700;">${t('rp.somethingWrong')}</p>
          <p class="text-faint" style="font-size:12.5px;max-width:320px;">${message}</p>
          <button class="btn-primary" id="retryBtn" style="margin-top:8px;">${t('rp.tryAgain')}</button>
        </div>`;
      document.getElementById('retryBtn').addEventListener('click', retryFn);
    }

    async function loadScenarios() {
      renderLoading(t('rp.scoutingConvos'));
      try {
        const avoid = await fetchRecentValues('roleplay_scenarios', 'title', profile.target_language, profile.current_level, 5);
        const token = await getAuthToken();
        const res = await fetch(ROLEPLAY_SCENARIOS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body: JSON.stringify({
            targetLanguage: langByCode(profile.target_language).name,
            nativeLanguage: profile.native_language,
            level: profile.current_level,
            interest: sessionTopic || 'daily life',
            angle: randomAngle(),
            avoid,
          }),
        });
        const raw = await res.text();
        if (!raw) throw new Error('Empty response (HTTP ' + res.status + ')');
        const data = JSON.parse(raw);
        if (!res.ok || data.error) throw new Error(data.error || ('HTTP ' + res.status));
        if (!data.scenarios || !data.scenarios.length) throw new Error('No scenarios returned');
        scenarios = data.scenarios;
        if (planCtx) {
          // Plan mode skips the scenario-picker screen too, to keep a
          // build-my-plan session moving without an extra choice.
          startSession(scenarios[Math.floor(Math.random() * scenarios.length)]);
        } else {
          renderPicker();
        }
      } catch (e) {
        renderError(e.message || 'Unknown error', loadScenarios);
      }
    }

    function renderPicker() {
      document.getElementById('topLabel').textContent = t('rp.talk');
      document.getElementById('roleplayBody').innerHTML = `
        <div class="lesson-body">
          <h1 style="font-size:24px;margin-bottom:6px;">${t('rp.pickConvo')}</h1>
          <p class="text-dim" style="font-size:14px;margin-bottom:20px;">${t('rp.yakWillPlay', { lang: langDisplay(profile.target_language) })}</p>
          <div style="display:flex;flex-direction:column;gap:10px;" id="scenarioList"></div>
        </div>`;
      const list = document.getElementById('scenarioList');
      list.innerHTML = scenarios.map((s, i) => `
        <button class="scenario-card" data-i="${i}">
          <span style="font-weight:800;font-family:var(--font-display);font-size:15.5px;">${s.title}</span>
          <span class="text-dim" style="font-size:12.5px;">${s.persona}</span>
          <span class="chip-mini" style="margin-top:4px;">${s.goal}</span>
        </button>`).join('');
      list.querySelectorAll('.scenario-card').forEach(btn => {
        btn.addEventListener('click', () => startSession(scenarios[parseInt(btn.dataset.i)]));
      });
    }

    async function startSession(chosen) {
      renderLoading(t('rp.settingScene'));
      scenario = chosen;
      transcript = [{ speaker: 'ai', text: chosen.openingLine, native: chosen.openingLineNative }];
      turnCount = 0;
      goalCompleted = false;
      grammarFlagged = [];

      const { data: scenarioRow } = await db.from('roleplay_scenarios').insert({
        target_language: profile.target_language,
        level: profile.current_level,
        title: chosen.title,
        persona: chosen.persona,
        goal: chosen.goal,
        system_prompt: chosen.persona + ' Goal: ' + chosen.goal,
        interest_tag: sessionTopic || null,
      }).select('id').single();

      const { data: sessionRow } = await db.from('roleplay_sessions').insert({
        user_id: user.id,
        scenario_id: scenarioRow ? scenarioRow.id : null,
        status: 'in_progress',
        transcript,
      }).select('id').single();
      sessionId = sessionRow ? sessionRow.id : null;

      renderChat();
    }

    function renderChat() {
      document.getElementById('topLabel').textContent = planStepPrefix() + scenario.title;
      document.getElementById('roleplayBody').innerHTML = `
        ${goalCompleted ? `<div class="goal-banner">${t('rp.goalReachedBanner')}</div>` : ''}
        <div class="chat-scroll" id="chatScroll"></div>
        <p class="text-faint" id="micHint" style="font-size:11.5px;padding:0 20px;min-height:14px;"></p>
        <div class="chat-input-bar">
          ${micSupported ? `<button class="mic-btn-sm" id="micBtn">🎙️</button>` : ''}
          <input id="chatInput" class="input" placeholder="${t('rp.typeReply', { lang: langDisplay(profile.target_language) })}">
          <button class="btn-primary" id="sendBtn">${t('rp.send')}</button>
        </div>
        <div style="padding:8px 20px 0;">
          <button class="btn-ghost" id="finishBtn">${t('rp.endConvo')}</button>
        </div>`;

      renderTranscript();

      const input = document.getElementById('chatInput');
      const sendBtn = document.getElementById('sendBtn');
      const send = () => { if (!busy && input.value.trim()) sendMessage(input.value.trim()); };
      sendBtn.addEventListener('click', send);
      input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
      document.getElementById('finishBtn').addEventListener('click', finishSession);
      if (micSupported) {
        document.getElementById('micBtn').addEventListener('click', toggleRecording);
      }
    }

    function renderTranscript() {
      const scroll = document.getElementById('chatScroll');
      if (!scroll) return;
      const tts = langByCode(profile.target_language).tts;
      scroll.innerHTML = transcript.map(t => `
        <div class="chat-line${t.speaker === 'user' ? ' user' : ''}">
          <div style="display:flex;align-items:flex-start;gap:6px;">
            ${t.speaker === 'ai' ? `<button class="icon-btn icon-btn-sm" data-speak="${encodeURIComponent(t.text)}" style="margin-top:-2px;">🔊</button>` : ''}
            <div>${t.text}</div>
          </div>
          ${t.native ? `<div class="native">${t.native}</div>` : ''}
          ${t.correction ? `<div class="correction-note">${t.correction}</div>` : ''}
        </div>`).join('');
      scroll.querySelectorAll('[data-speak]').forEach(btn => {
        btn.addEventListener('click', () => speak(decodeURIComponent(btn.dataset.speak), tts));
      });
      scroll.scrollTop = scroll.scrollHeight;
    }

    // Mic input: browser speech recognition (same approach as input.html's
    // pronunciation recorder) fills the chat text box with what it heard —
    // the learner still reviews/edits and taps Send themselves, so a
    // misheard word never gets sent by accident.
    function toggleRecording() {
      if (isRecording) { stopRecording(); return; }
      startRecording();
    }

    function startRecording() {
      const micBtn = document.getElementById('micBtn');
      const hint = document.getElementById('micHint');
      const input = document.getElementById('chatInput');
      if (!micBtn || !hint || !input) return;
      const tts = langByCode(profile.target_language).tts;

      recognition = new SR();
      recognition.lang = tts;
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.maxAlternatives = 1;
      recognition.onresult = (e) => {
        let tr = '';
        for (let i = 0; i < e.results.length; i++) tr += e.results[i][0].transcript;
        input.value = tr;
      };
      recognition.onerror = (e) => {
        if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
          hint.textContent = t('rp.micPermissionError');
          stopRecording();
        }
      };
      try {
        recognition.start();
      } catch (e) { return; }

      isRecording = true;
      micBtn.classList.add('recording');
      micBtn.textContent = '⏹️';
      hint.textContent = t('rp.listening');
    }

    function stopRecording() {
      const micBtn = document.getElementById('micBtn');
      const hint = document.getElementById('micHint');
      isRecording = false;
      if (recognition) { try { recognition.stop(); } catch (e) {} }
      if (micBtn) { micBtn.classList.remove('recording'); micBtn.textContent = '🎙️'; }
      if (hint) hint.textContent = '';
    }

    async function sendMessage(text) {
      if (isRecording) stopRecording();
      busy = true;
      const input = document.getElementById('chatInput');
      const sendBtn = document.getElementById('sendBtn');
      input.value = '';
      input.disabled = true;
      sendBtn.disabled = true;
      sendBtn.textContent = '…'; // ellipsis reads fine across all locales as a "sending" indicator

      transcript.push({ speaker: 'user', text });
      renderTranscript();

      try {
        const token = await getAuthToken();
        const res = await fetch(ROLEPLAY_REPLY_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body: JSON.stringify({
            targetLanguage: langByCode(profile.target_language).name,
            nativeLanguage: profile.native_language,
            level: profile.current_level,
            persona: scenario.persona,
            goal: scenario.goal,
            transcript: transcript.slice(0, -1),
            userMessage: text,
          }),
        });
        const raw = await res.text();
        const data = JSON.parse(raw);
        if (!res.ok || data.error) throw new Error(data.error || ('HTTP ' + res.status));

        if (data.correction && data.correction.hasIssue) {
          transcript[transcript.length - 1].correction = data.correction.note;
          if (data.correction.grammarCode) {
            const { data: gp } = await db.from('grammar_points')
              .upsert({
                target_language: profile.target_language,
                code: data.correction.grammarCode,
                label: data.correction.grammarLabel || data.correction.grammarCode,
                level: profile.current_level,
                description: data.correction.note,
              }, { onConflict: 'target_language,code' })
              .select('id').single();
            if (gp) {
              await recordSkillResult(user.id, 'grammar', gp.id, false);
              if (!grammarFlagged.includes(data.correction.grammarLabel)) grammarFlagged.push(data.correction.grammarLabel);
            }
          }
        }

        transcript.push({ speaker: 'ai', text: data.reply, native: data.replyNative });
        turnCount++;
        if (data.goalCompleted) goalCompleted = true;

        if (sessionId) {
          await db.from('roleplay_sessions').update({ transcript, goal_completed: goalCompleted }).eq('id', sessionId);
        }

        if (turnCount >= maxTurns) { finishSession(); return; }
        renderChat();
      } catch (e) {
        transcript.push({ speaker: 'ai', text: t('rp.couldntReach'), native: e.message || '' });
        renderChat();
      } finally {
        busy = false;
      }
    }

    async function finishSession() {
      if (isRecording) stopRecording();
      const xpEarned = 20 + (goalCompleted ? 20 : 0);
      document.getElementById('roleplayBody').innerHTML = `
        <div class="lesson-center">
          <div style="font-size:40px;">${goalCompleted ? '🏆' : '💬'}</div>
          <h2 style="font-size:24px;margin:14px 0 4px;">${goalCompleted ? t('rp.goalReached') : t('rp.convoEnded')}</h2>
          <p class="text-dim" style="font-size:14.5px;">${t('rp.exchanges', { n: turnCount })} · +${xpEarned} XP</p>
          ${grammarFlagged.length ? `
            <div class="card" style="margin-top:18px;text-align:left;max-width:340px;">
              <span class="label">${t('rp.flaggedForReview')}</span>
              <p class="text-dim" style="font-size:13px;">${grammarFlagged.join(', ')}</p>
              <p class="text-faint" style="font-size:11.5px;margin-top:6px;">${t('rp.comeBackAround')}</p>
            </div>` : ''}
          <div id="levelUpSlot" style="width:100%;"></div>
          <button class="btn-primary" id="doneBtn" style="margin-top:20px;">${planCtx ? t('pl.continuePlan') : t('rp.backToHome')}</button>
        </div>`;
      document.getElementById('doneBtn').addEventListener('click', () => {
        if (planCtx) { window.location.href = advancePlanAndGetNextUrl(planCtx.plan, xpEarned); }
        else { window.location.href = 'dashboard.html'; }
      });

      if (sessionId) {
        await db.from('roleplay_sessions').update({
          status: 'completed', goal_completed: goalCompleted, grammar_flagged: grammarFlagged,
          xp_earned: xpEarned, completed_at: new Date().toISOString(),
        }).eq('id', sessionId);
      }

      const today = new Date().toISOString().slice(0, 10);
      const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
      const newStreak = profile.last_activity_date === today ? profile.streak
        : profile.last_activity_date === yesterday ? profile.streak + 1 : 1;
      await db.from('profiles').update({
        xp: profile.xp + xpEarned, streak: newStreak, last_activity_date: today,
      }).eq('id', user.id);
      profile.xp += xpEarned; profile.streak = newStreak; profile.last_activity_date = today;

      const levelUp = await recordActivityAndMaybeEvaluate(user, profile);
      if (levelUp) document.getElementById('levelUpSlot').innerHTML = celebrationHTML(levelUp);
    }

    document.getElementById('exitBtn').addEventListener('click', () => {
      if (isRecording) stopRecording();
      window.location.href = 'dashboard.html';
    });

    (async () => {
      user = await requireAuth();
      if (!user) return;
      profile = await getProfile(user.id);
      if (!profile || !profile.name) { window.location.href = 'onboarding.html'; return; }
      setLocale(profile.native_language);
      planCtx = isPlanStepActive('roleplay');
      document.getElementById('topLabel').textContent = '';
      if (planCtx) {
        maxTurns = Math.min(Math.max(Math.round(planCtx.step.minutes * 0.8), 4), 16);
        sessionTopic = pickTopicForSession(getLastTopics(profile));
        loadScenarios();
      } else {
        renderTopicPicker(document.getElementById('roleplayBody'), {
          initial: getLastTopics(profile),
          onStart: async (selection) => {
            await saveLastTopics(user.id, selection);
            sessionTopic = pickTopicForSession(selection);
            loadScenarios();
          },
        });
      }
    })();
  </script>
</body>
</html>
