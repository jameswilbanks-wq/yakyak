<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YakYak — Let's set up your path</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="center-screen">
    <div class="step-shell" id="stepShell">
      <div class="progress-bar" id="progressBar"></div>
      <div id="stepContent"></div>
      <div class="step-footer" id="stepFooter"></div>
    </div>
  </div>

  <script src="supabase-client.js"></script>
  <script src="i18n.js"></script>
  <script>
    const NATIVE_LANGS = ['English', 'Spanish', 'Portuguese', 'French', 'German', 'Mandarin', 'Other'];
    const MOTIVATIONS = [
      { id: 'Travel', key: 'mot.travel' }, { id: 'Relationships', key: 'mot.relationships' },
      { id: 'Business', key: 'mot.business' }, { id: 'School', key: 'mot.school' },
      { id: 'Citizenship', key: 'mot.citizenship' }, { id: 'Conversation', key: 'mot.conversation' },
      { id: 'Reading books', key: 'mot.reading' }, { id: 'Working abroad', key: 'mot.working_abroad' },
    ];
    // How-much-time-per-day is no longer asked here — it's now a per-session
    // question at the top of the "build my plan" flow (see TIME_OPTIONS in
    // supabase-client.js), since the right answer varies day to day more
    // than it's a fixed trait to set once at signup.
    const STYLES = [
      { id: 'visual', key: 'style.visual' },
      { id: 'reading', key: 'style.reading' },
      { id: 'speaking', key: 'style.speaking' },
      { id: 'listening', key: 'style.listening' },
      { id: 'mixed', key: 'style.mixed' },
    ];
    // Topics (interests) are no longer picked here — that question moved to
    // a per-session picker at the top of each learning module, since a
    // one-time onboarding pick meant every lesson forever used the same
    // narrow topic list. See INTERESTS/renderTopicPicker in supabase-client.js.

    const steps = ['name', 'level', 'motivation', 'style'];
    let stepIndex = 0;
    let user = null;

    const form = {
      name: '', native: 'English', learning: null, current: null, target: null,
      motivations: [], style: null,
    };

    // The 'level' step has its own little sub-flow: a brand-new learner
    // either already knows their CEFR level (the original ladder picker,
    // still here unchanged) or doesn't and wants a quick placement test to
    // figure it out. levelMode tracks which of those four screens is
    // showing right now — it's pure UI state, never written to the
    // profile, so it isn't reset by re-rendering the step.
    // 'choose' -> 'testing' -> 'result' -> 'manual' (ladder, pre-filled)
    //          -> 'manual' directly if they already know their level
    let levelMode = 'choose';
    let placementQuestions = [], placementAnswers = [], placementIdx = 0;
    let placementLoading = false, placementError = false;
    let placementResultLevel = null, placementSuggestedTarget = null;

    function valid() {
      switch (steps[stepIndex]) {
        case 'name': return form.name.trim().length > 0 && form.learning !== null;
        case 'level': return form.current && form.target;
        case 'motivation': return form.motivations.length > 0;
        case 'style': return form.style !== null;
      }
    }

    function toggleArr(arr, val, max) {
      const i = arr.indexOf(val);
      if (i >= 0) { arr.splice(i, 1); return; }
      if (max && arr.length >= max) return;
      arr.push(val);
    }

    function renderProgress() {
      document.getElementById('progressBar').innerHTML = steps.map((_, i) =>
        `<div class="progress-seg${i <= stepIndex ? ' filled' : ''}"></div>`).join('');
    }

    function renderFooter() {
      const footer = document.getElementById('stepFooter');
      const s = steps[stepIndex];
      // The choose/testing/result screens on the 'level' step have their
      // own inline action buttons (pick a path, tap an answer, continue
      // from results) — the wizard's standard Continue button would just
      // be redundant (and, since form.target isn't set yet, permanently
      // disabled) alongside them, so it's hidden for those three screens
      // and only reappears once the ladder ('manual') is showing.
      const hideNext = s === 'level' && levelMode !== 'manual';
      footer.innerHTML = `
        ${stepIndex > 0 ? `<button class="btn-ghost" id="backBtn">${t('ob.back')}</button>` : '<span></span>'}
        ${hideNext ? '<span></span>' : `<button class="btn-primary" id="nextBtn" ${valid() ? '' : 'disabled'}>${stepIndex === steps.length - 1 ? t('ob.buildPlan') : t('ob.continue')}</button>`}
      `;
      if (stepIndex > 0) {
        document.getElementById('backBtn').addEventListener('click', () => {
          // Backing out of the test or its results screen should return to
          // the choose screen, not leave the level step entirely and lose
          // the language/name already entered on the previous step.
          if (s === 'level' && (levelMode === 'testing' || levelMode === 'result')) { levelMode = 'choose'; renderStep(); }
          else { stepIndex--; renderStep(); }
        });
      }
      if (!hideNext) document.getElementById('nextBtn').addEventListener('click', onNext);
    }

    async function onNext() {
      if (stepIndex === steps.length - 1) {
        await finishOnboarding();
        return;
      }
      stepIndex++;
      renderStep();
    }

    function renderStep() {
      renderProgress();
      const content = document.getElementById('stepContent');
      const s = steps[stepIndex];

      if (s === 'name') {
        content.innerHTML = `
          <div id="mascotSlot" style="width:52px;margin-bottom:16px;"></div>
          <h1 style="font-size:30px;margin-bottom:6px;">${t('ob.heyImYak')}</h1>
          <p class="text-dim" style="margin-bottom:28px;font-size:15px;">${t('ob.buildPath')}</p>
          <label class="label">${t('ob.yourName')}</label>
          <input id="nameInput" class="input" placeholder="${t('ob.namePlaceholder')}" style="margin-bottom:24px;" value="${form.name}">
          <label class="label">${t('ob.yourNativeLang')}</label>
          <div class="chip-row" id="nativeChips"></div>
          <label class="label" style="margin-top:22px;">${t('ob.langToLearn')}</label>
          <div class="chip-row" id="learningChips"></div>
          <div id="learningBadge" style="margin-top:20px;"></div>
        `;
        document.getElementById('mascotSlot').innerHTML = mascotHTML(52);
        document.getElementById('nameInput').addEventListener('input', e => { form.name = e.target.value; renderFooter(); });
        const nativeChips = document.getElementById('nativeChips');
        nativeChips.innerHTML = NATIVE_LANGS.map(l => `<button class="chip${form.native === l ? ' active' : ''}" data-l="${l}">${nativeLangDisplay(l)}</button>`).join('');
        nativeChips.querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => { form.native = b.dataset.l; setLocale(form.native); renderStep(); }));
        const learningChips = document.getElementById('learningChips');
        learningChips.innerHTML = LANGUAGES.map(l => `<button class="chip${form.learning?.code === l.code ? ' active' : ''}" data-c="${l.code}">${langDisplay(l.code)}</button>`).join('');
        learningChips.querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => { form.learning = langByCode(b.dataset.c); renderStep(); }));
        if (form.learning) {
          document.getElementById('learningBadge').innerHTML = `
            <div style="display:flex;align-items:center;gap:10px;">
              <span class="badge">${form.learning.flag}</span>
              <span class="text-dim" style="font-size:13.5px;">${t('ob.youreLearning')} <b style="color:var(--text);">${langDisplay(form.learning.code)}</b></span>
            </div>`;
        }
      }

      if (s === 'level') {
        if (levelMode === 'choose') renderLevelChoice(content);
        else if (levelMode === 'testing') renderPlacementTesting(content);
        else if (levelMode === 'result') renderPlacementResult(content);
        else renderLevelLadder(content);
      }

      if (s === 'motivation') {
        content.innerHTML = `
          <h1 style="font-size:26px;margin-bottom:8px;">${t('ob.why')} ${form.learning ? langDisplay(form.learning.code) : ''}${t('ob.whyNow')}</h1>
          <p class="text-dim" style="margin-bottom:20px;font-size:14px;">${t('ob.chooseMany')}</p>
          <div class="grid-3" id="motivGrid"></div>
        `;
        const grid = document.getElementById('motivGrid');
        grid.innerHTML = MOTIVATIONS.map(m => `<button class="tile${form.motivations.includes(m.id) ? ' active' : ''}" data-m="${m.id}"><span>${t(m.key)}</span></button>`).join('');
        grid.querySelectorAll('.tile').forEach(b => b.addEventListener('click', () => { toggleArr(form.motivations, b.dataset.m); renderStep(); }));
      }

      if (s === 'style') {
        content.innerHTML = `
          <h1 style="font-size:26px;margin-bottom:8px;">${t('ob.learnBest')}</h1>
          <p class="text-dim" style="margin-bottom:20px;font-size:14px;">${t('ob.leanInto')}</p>
          <div style="display:flex;flex-direction:column;gap:10px;" id="styleList"></div>
        `;
        const list = document.getElementById('styleList');
        list.innerHTML = STYLES.map(opt => `
          <button class="row-option${form.style === opt.id ? ' active' : ''}" data-s="${opt.id}">
            <span style="font-weight:700;font-size:15px;">${t(opt.key + '.label')}</span>
            <span class="text-faint" style="font-size:12.5px;">${t(opt.key + '.desc')}</span>
          </button>`).join('');
        list.querySelectorAll('.row-option').forEach(b => b.addEventListener('click', () => { form.style = b.dataset.s; renderStep(); }));
      }

      renderFooter();
    }

    function updateLevelHint() {
      const hint = document.getElementById('levelHint');
      if (!hint) return;
      if (!form.current) hint.textContent = t('ob.levelHint1');
      else if (!form.target) hint.innerHTML = `<b style="color:var(--text);">${form.current}</b> ${t('ob.levelHint2')}`;
      else hint.innerHTML = `${t('ob.levelHint3a')} <b style="color:var(--text);">${form.current}</b> ${t('ob.levelHint3b')} <b style="color:var(--text);">${form.target}</b>.`;
    }

    // --- Level step, screen 1: know it or test it? -------------------------

    function renderLevelChoice(content) {
      content.innerHTML = `
        <h1 style="font-size:26px;margin-bottom:8px;">${t('ob.whereHeaded')}</h1>
        <p class="text-dim" style="margin-bottom:20px;font-size:14px;">${t('plt.chooseSubtitle')}</p>
        <button class="dark-band" id="knowLevelBtn" style="text-align:left;width:100%;cursor:pointer;border:none;display:block;">
          <div style="font-size:17px;font-weight:800;font-family:var(--font-display);color:#F5F8EE;">${t('plt.knowLevelTitle')}</div>
          <p style="font-size:13px;margin-top:4px;color:rgba(245,248,238,.72);">${t('plt.knowLevelDesc')}</p>
        </button>
        <button class="card" id="takeTestBtn" style="text-align:left;width:100%;cursor:pointer;margin-top:12px;">
          <div style="font-size:17px;font-weight:800;font-family:var(--font-display);">${t('plt.takeTestTitle')}</div>
          <p class="text-dim" style="font-size:13px;margin-top:4px;">${t('plt.takeTestDesc')}</p>
        </button>
      `;
      document.getElementById('knowLevelBtn').addEventListener('click', () => { levelMode = 'manual'; renderStep(); });
      document.getElementById('takeTestBtn').addEventListener('click', startPlacementTest);
    }

    // --- Level step, screen 2 (know it): the existing ladder picker --------

    function renderLevelLadder(content) {
      content.innerHTML = `
        <h1 style="font-size:26px;margin-bottom:8px;">${t('ob.whereHeaded')}</h1>
        <p class="text-dim" id="levelHint" style="margin-bottom:4px;font-size:14px;"></p>
        <div class="card" id="ladderCard" style="padding:18px 18px 6px;margin-top:18px;"></div>
        <button class="btn-ghost" id="notSureBtn" style="margin-top:14px;padding-left:0;">${t('plt.notSureLink')}</button>
      `;
      updateLevelHint();
      renderLadder(document.getElementById('ladderCard'), {
        mode: 'select', current: form.current, target: form.target,
        onSelect: (code) => {
          if (!form.current) { form.current = code; }
          else if (!form.target) {
            const curIdx = LEVELS.findIndex(l => l.code === form.current);
            const codeIdx = LEVELS.findIndex(l => l.code === code);
            if (codeIdx <= curIdx) { form.current = code; form.target = null; }
            else { form.target = code; }
          } else { form.current = code; form.target = null; }
          renderStep();
        }
      });
      document.getElementById('notSureBtn').addEventListener('click', startPlacementTest);
    }

    // --- Level step, screen 3: the placement test ---------------------------
    // A quick (10-question, ~2 minute) multiple-choice battery — 2 questions
    // each at A1/A2/B1/B2/C1 — for a learner who has no idea where to start.
    // Answered questions are graded locally (each has its own correctIndex,
    // no AI call needed to check them), and the CEFR placement is derived
    // from the pattern of right/wrong answers by computePlacementLevel().

    async function startPlacementTest() {
      levelMode = 'testing';
      placementLoading = true;
      placementError = false;
      renderStep();
      try {
        const token = await getAuthToken();
        const res = await fetch(GENERATE_PLACEMENT_TEST_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body: JSON.stringify({ targetLanguage: form.learning.name, nativeLanguage: form.native }),
        });
        const raw = await res.text();
        const data = JSON.parse(raw);
        if (!res.ok || data.error) throw new Error(data.error || ('HTTP ' + res.status));
        if (!data.questions || data.questions.length < 10) throw new Error('Placement battery too small');
        placementQuestions = data.questions.slice(0, 10);
        placementAnswers = [];
        placementIdx = 0;
        placementLoading = false;
        renderStep();
      } catch (e) {
        placementLoading = false;
        placementError = true;
        renderStep();
      }
    }

    function renderPlacementTesting(content) {
      if (placementLoading) {
        content.innerHTML = `
          <div class="lesson-center" style="padding:60px 0;">
            <div id="mascotSlot" style="width:52px;"></div>
            <p class="text-dim" style="margin-top:16px;font-size:14.5px;">${t('lvt.building')}</p>
          </div>`;
        document.getElementById('mascotSlot').innerHTML = mascotHTML(52);
        return;
      }
      if (placementError) {
        content.innerHTML = `
          <div class="lesson-center error-box" style="padding:50px 0;">
            <div style="color:var(--danger);">${icon('warning', { size: 30 })}</div>
            <p style="font-weight:700;">${t('lvt.couldntBuild')}</p>
            <button class="btn-primary" id="retryTestBtn">${t('ls.tryAgain')}</button>
          </div>`;
        document.getElementById('retryTestBtn').addEventListener('click', startPlacementTest);
        return;
      }
      renderPlacementQuestion(content);
    }

    function renderPlacementQuestion(content) {
      const total = placementQuestions.length;
      const q = placementQuestions[placementIdx];
      content.innerHTML = `
        <p class="text-faint" style="font-size:12px;margin-bottom:4px;">${t('lvt.questionOf', { n: placementIdx + 1, total })}</p>
        <div class="progress-bar" style="margin:0 0 20px;">${placementQuestions.map((_, i) => `<div class="progress-seg${i <= placementIdx ? ' filled' : ''}"></div>`).join('')}</div>
        <h1 style="font-size:19px;margin-bottom:18px;">${escapeHtml(q.prompt)}</h1>
        <div style="display:flex;flex-direction:column;gap:10px;" id="plOptList"></div>
        <button class="btn-ghost" id="plExitBtn" style="margin-top:18px;padding-left:0;">${t('plt.exitTest')}</button>
      `;
      const optList = document.getElementById('plOptList');
      optList.innerHTML = q.options.map((opt, i) => `<button class="row-option" data-i="${i}"><span>${escapeHtml(opt)}</span></button>`).join('');
      optList.querySelectorAll('.row-option').forEach(b => b.addEventListener('click', () => {
        placementAnswers[placementIdx] = parseInt(b.dataset.i, 10);
        placementIdx++;
        if (placementIdx < total) { renderPlacementQuestion(content); }
        else finishPlacementTest();
      }));
      document.getElementById('plExitBtn').addEventListener('click', () => { levelMode = 'choose'; renderStep(); });
    }

    // Walk the CEFR tiers from the bottom up: each tier the learner clears
    // (at least 1 of its 2 questions right) becomes the new placement floor;
    // the walk stops the moment a tier is missed completely (0/2), since
    // getting nothing right at a level is a reasonable signal they're not
    // there yet — no point crediting tiers above that. A learner who misses
    // everything, including A1, is placed at Pre-A1 (the floor already used
    // elsewhere in the app for absolute beginners).
    function computePlacementLevel() {
      const order = ['A1', 'A2', 'B1', 'B2', 'C1'];
      const tierStats = {};
      order.forEach(lvl => { tierStats[lvl] = { correct: 0, total: 0 }; });
      placementQuestions.forEach((q, i) => {
        const s = tierStats[q.level];
        if (!s) return;
        s.total++;
        if (placementAnswers[i] === q.correctIndex) s.correct++;
      });
      let placement = 'Pre-A1';
      for (const lvl of order) {
        if (tierStats[lvl].correct >= 1) placement = lvl;
        if (tierStats[lvl].correct === 0) break;
      }
      return { placement, tierStats };
    }

    async function finishPlacementTest() {
      const { placement, tierStats } = computePlacementLevel();
      placementResultLevel = placement;
      const idx = Math.max(0, LEVELS.findIndex(l => l.code === placement));
      placementSuggestedTarget = LEVELS[Math.min(LEVELS.length - 1, idx + 2)].code;

      try {
        await db.from('placement_test_attempts').insert({
          user_id: user.id,
          target_language: form.learning.code,
          native_language: form.native,
          determined_level: placement,
          level_scores: tierStats,
        });
      } catch (e) { /* best-effort history row — must not block onboarding */ }

      levelMode = 'result';
      renderStep();
    }

    // --- Level step, screen 4: placement result, then into the ladder ------

    function renderPlacementResult(content) {
      content.innerHTML = `
        <div class="lesson-center" style="padding:20px 0 24px;">
          <div style="color:var(--dark);">${icon('trophy', { size: 36 })}</div>
          <h1 style="font-size:23px;margin-top:10px;">${t('plt.resultTitle')}</h1>
          <p class="text-dim" style="font-size:14.5px;margin-top:6px;max-width:320px;">${t('plt.resultBody', { level: placementResultLevel, label: levelLabel(placementResultLevel) })}</p>
        </div>
        <button class="btn-primary" id="plContinueBtn" style="width:100%;justify-content:center;">${t('plt.continueBtn')}</button>
        <button class="btn-ghost" id="plRetakeBtn" style="width:100%;justify-content:center;margin-top:8px;">${t('plt.retakeBtn')}</button>
      `;
      document.getElementById('plContinueBtn').addEventListener('click', () => {
        form.current = placementResultLevel;
        form.target = placementSuggestedTarget;
        levelMode = 'manual';
        renderStep();
      });
      document.getElementById('plRetakeBtn').addEventListener('click', startPlacementTest);
    }

    async function finishOnboarding() {
      document.getElementById('stepShell').innerHTML = `
        <div class="fade-slide" style="max-width:380px;">
          <div id="mascotSlot" style="width:56px;margin:0 auto;"></div>
          <p style="margin-top:22px;font-size:15.5px;">${t('ob.buildingPlan')}</p>
        </div>`;
      document.getElementById('mascotSlot').innerHTML = mascotHTML(56);

      // Upsert (not update): in DEV_MODE there's no signup trigger creating
      // a profiles row ahead of time, so this needs to work whether or not
      // one already exists. Safe to keep this way after real auth returns.
      const { error } = await db.from('profiles').upsert({
        id: user.id,
        name: form.name,
        native_language: form.native,
        target_language: form.learning.code,
        current_level: form.current,
        target_level: form.target,
        learning_style: form.style,
        motivations: form.motivations,
      });

      if (error) {
        document.getElementById('stepShell').innerHTML = `<p style="color:var(--danger);">${t('ob.saveError')} ${error.message}</p>`;
        return;
      }
      window.location.href = 'dashboard.html';
    }

    (async () => {
      user = await requireAuth();
      if (!user) return;
      renderStep();
    })();
  </script>
</body>
</html>
