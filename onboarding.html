<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YakYak — Let's set up your path</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="center-screen">
    <div class="step-shell" id="stepShell">
      <div class="progress-bar" id="progressBar"></div>
      <div id="stepContent"></div>
      <div class="step-footer" id="stepFooter"></div>
    </div>
  </div>

  <script src="supabase-client.js"></script>
  <script src="i18n.js"></script>
  <script>
    const NATIVE_LANGS = ['English', 'Spanish', 'Portuguese', 'French', 'German', 'Mandarin', 'Other'];
    const MOTIVATIONS = [
      { id: 'Travel', key: 'mot.travel' }, { id: 'Relationships', key: 'mot.relationships' },
      { id: 'Business', key: 'mot.business' }, { id: 'School', key: 'mot.school' },
      { id: 'Citizenship', key: 'mot.citizenship' }, { id: 'Conversation', key: 'mot.conversation' },
      { id: 'Reading books', key: 'mot.reading' }, { id: 'Working abroad', key: 'mot.working_abroad' },
    ];
    // How-much-time-per-day is no longer asked here — it's now a per-session
    // question at the top of the "build my plan" flow (see TIME_OPTIONS in
    // supabase-client.js), since the right answer varies day to day more
    // than it's a fixed trait to set once at signup.
    const STYLES = [
      { id: 'visual', key: 'style.visual' },
      { id: 'reading', key: 'style.reading' },
      { id: 'speaking', key: 'style.speaking' },
      { id: 'listening', key: 'style.listening' },
      { id: 'mixed', key: 'style.mixed' },
    ];
    // Topics (interests) are no longer picked here — that question moved to
    // a per-session picker at the top of each learning module, since a
    // one-time onboarding pick meant every lesson forever used the same
    // narrow topic list. See INTERESTS/renderTopicPicker in supabase-client.js.

    const steps = ['name', 'level', 'motivation', 'style', 'avatar'];
    let stepIndex = 0;
    let user = null;

    const form = {
      name: '', native: 'English', learning: null, current: null, target: null,
      motivations: [], style: null, avatar: null,
    };

    function valid() {
      switch (steps[stepIndex]) {
        case 'name': return form.name.trim().length > 0 && form.learning !== null;
        case 'level': return form.current && form.target;
        case 'motivation': return form.motivations.length > 0;
        case 'style': return form.style !== null;
        case 'avatar': return form.avatar !== null;
      }
    }

    function toggleArr(arr, val, max) {
      const i = arr.indexOf(val);
      if (i >= 0) { arr.splice(i, 1); return; }
      if (max && arr.length >= max) return;
      arr.push(val);
    }

    function renderProgress() {
      document.getElementById('progressBar').innerHTML = steps.map((_, i) =>
        `<div class="progress-seg${i <= stepIndex ? ' filled' : ''}"></div>`).join('');
    }

    function renderFooter() {
      const footer = document.getElementById('stepFooter');
      footer.innerHTML = `
        ${stepIndex > 0 ? `<button class="btn-ghost" id="backBtn">${t('ob.back')}</button>` : '<span></span>'}
        <button class="btn-primary" id="nextBtn" ${valid() ? '' : 'disabled'}>${stepIndex === steps.length - 1 ? t('ob.buildPlan') : t('ob.continue')}</button>
      `;
      if (stepIndex > 0) document.getElementById('backBtn').addEventListener('click', () => { stepIndex--; renderStep(); });
      document.getElementById('nextBtn').addEventListener('click', onNext);
    }

    async function onNext() {
      if (stepIndex === steps.length - 1) {
        await finishOnboarding();
        return;
      }
      stepIndex++;
      renderStep();
    }

    function renderStep() {
      renderProgress();
      const content = document.getElementById('stepContent');
      const s = steps[stepIndex];

      if (s === 'name') {
        content.innerHTML = `
          <div id="mascotSlot" style="width:52px;margin-bottom:16px;"></div>
          <h1 style="font-size:30px;margin-bottom:6px;">${t('ob.heyImYak')}</h1>
          <p class="text-dim" style="margin-bottom:28px;font-size:15px;">${t('ob.buildPath')}</p>
          <label class="label">${t('ob.yourName')}</label>
          <input id="nameInput" class="input" placeholder="${t('ob.namePlaceholder')}" style="margin-bottom:24px;" value="${form.name}">
          <label class="label">${t('ob.yourNativeLang')}</label>
          <div class="chip-row" id="nativeChips"></div>
          <label class="label" style="margin-top:22px;">${t('ob.langToLearn')}</label>
          <div class="chip-row" id="learningChips"></div>
          <div id="learningBadge" style="margin-top:20px;"></div>
        `;
        document.getElementById('mascotSlot').innerHTML = mascotHTML(52);
        document.getElementById('nameInput').addEventListener('input', e => { form.name = e.target.value; renderFooter(); });
        const nativeChips = document.getElementById('nativeChips');
        nativeChips.innerHTML = NATIVE_LANGS.map(l => `<button class="chip${form.native === l ? ' active' : ''}" data-l="${l}">${nativeLangDisplay(l)}</button>`).join('');
        nativeChips.querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => { form.native = b.dataset.l; setLocale(form.native); renderStep(); }));
        const learningChips = document.getElementById('learningChips');
        learningChips.innerHTML = LANGUAGES.map(l => `<button class="chip${form.learning?.code === l.code ? ' active' : ''}" data-c="${l.code}">${langDisplay(l.code)}</button>`).join('');
        learningChips.querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => { form.learning = langByCode(b.dataset.c); renderStep(); }));
        if (form.learning) {
          document.getElementById('learningBadge').innerHTML = `
            <div style="display:flex;align-items:center;gap:10px;">
              <span class="badge">${form.learning.flag}</span>
              <span class="text-dim" style="font-size:13.5px;">${t('ob.youreLearning')} <b style="color:var(--text);">${langDisplay(form.learning.code)}</b></span>
            </div>`;
        }
      }

      if (s === 'level') {
        content.innerHTML = `
          <h1 style="font-size:26px;margin-bottom:8px;">${t('ob.whereHeaded')}</h1>
          <p class="text-dim" id="levelHint" style="margin-bottom:4px;font-size:14px;"></p>
          <div class="card" id="ladderCard" style="padding:18px 18px 6px;margin-top:18px;"></div>
        `;
        updateLevelHint();
        renderLadder(document.getElementById('ladderCard'), {
          mode: 'select', current: form.current, target: form.target,
          onSelect: (code) => {
            if (!form.current) { form.current = code; }
            else if (!form.target) {
              const curIdx = LEVELS.findIndex(l => l.code === form.current);
              const codeIdx = LEVELS.findIndex(l => l.code === code);
              if (codeIdx <= curIdx) { form.current = code; form.target = null; }
              else { form.target = code; }
            } else { form.current = code; form.target = null; }
            renderStep();
          }
        });
      }

      if (s === 'motivation') {
        content.innerHTML = `
          <h1 style="font-size:26px;margin-bottom:8px;">${t('ob.why')} ${form.learning ? langDisplay(form.learning.code) : ''}${t('ob.whyNow')}</h1>
          <p class="text-dim" style="margin-bottom:20px;font-size:14px;">${t('ob.chooseMany')}</p>
          <div class="grid-3" id="motivGrid"></div>
        `;
        const grid = document.getElementById('motivGrid');
        grid.innerHTML = MOTIVATIONS.map(m => `<button class="tile${form.motivations.includes(m.id) ? ' active' : ''}" data-m="${m.id}"><span>${t(m.key)}</span></button>`).join('');
        grid.querySelectorAll('.tile').forEach(b => b.addEventListener('click', () => { toggleArr(form.motivations, b.dataset.m); renderStep(); }));
      }

      if (s === 'style') {
        content.innerHTML = `
          <h1 style="font-size:26px;margin-bottom:8px;">${t('ob.learnBest')}</h1>
          <p class="text-dim" style="margin-bottom:20px;font-size:14px;">${t('ob.leanInto')}</p>
          <div style="display:flex;flex-direction:column;gap:10px;" id="styleList"></div>
        `;
        const list = document.getElementById('styleList');
        list.innerHTML = STYLES.map(opt => `
          <button class="row-option${form.style === opt.id ? ' active' : ''}" data-s="${opt.id}">
            <span style="font-weight:700;font-size:15px;">${t(opt.key + '.label')}</span>
            <span class="text-faint" style="font-size:12.5px;">${t(opt.key + '.desc')}</span>
          </button>`).join('');
        list.querySelectorAll('.row-option').forEach(b => b.addEventListener('click', () => { form.style = b.dataset.s; renderStep(); }));
      }

      if (s === 'avatar') {
        content.innerHTML = `
          <h1 style="font-size:26px;margin-bottom:8px;">${t('ob.pickYak')}</h1>
          <p class="text-dim" style="margin-bottom:20px;font-size:14px;">${t('ob.pickYakSub')}</p>
          <div style="display:flex;flex-wrap:wrap;gap:12px;justify-content:center;" id="avatarGrid"></div>
        `;
        const grid = document.getElementById('avatarGrid');
        grid.innerHTML = AVATARS.map(a => `
          <button class="tile${form.avatar === a.id ? ' active' : ''}" data-a="${a.id}" style="align-items:center;width:92px;">
            ${yakAvatarHTML(a.id, 60, [])}
            <span style="font-size:11.5px;font-weight:700;margin-top:4px;">${t(a.nameKey)}</span>
          </button>`).join('');
        grid.querySelectorAll('.tile').forEach(b => b.addEventListener('click', () => { form.avatar = b.dataset.a; renderStep(); }));
      }

      renderFooter();
    }

    function updateLevelHint() {
      const hint = document.getElementById('levelHint');
      if (!hint) return;
      if (!form.current) hint.textContent = t('ob.levelHint1');
      else if (!form.target) hint.innerHTML = `<b style="color:var(--text);">${form.current}</b> ${t('ob.levelHint2')}`;
      else hint.innerHTML = `${t('ob.levelHint3a')} <b style="color:var(--text);">${form.current}</b> ${t('ob.levelHint3b')} <b style="color:var(--text);">${form.target}</b>.`;
    }

    async function finishOnboarding() {
      document.getElementById('stepShell').innerHTML = `
        <div class="fade-slide" style="max-width:380px;">
          <div id="mascotSlot" style="width:56px;margin:0 auto;"></div>
          <p style="margin-top:22px;font-size:15.5px;">${t('ob.buildingPlan')}</p>
        </div>`;
      document.getElementById('mascotSlot').innerHTML = mascotHTML(56);

      // Upsert (not update): in DEV_MODE there's no signup trigger creating
      // a profiles row ahead of time, so this needs to work whether or not
      // one already exists. Safe to keep this way after real auth returns.
      const { error } = await db.from('profiles').upsert({
        id: user.id,
        name: form.name,
        native_language: form.native,
        target_language: form.learning.code,
        current_level: form.current,
        target_level: form.target,
        learning_style: form.style,
        motivations: form.motivations,
        avatar_id: form.avatar,
      });

      if (error) {
        document.getElementById('stepShell').innerHTML = `<p style="color:var(--danger);">${t('ob.saveError')} ${error.message}</p>`;
        return;
      }
      window.location.href = 'dashboard.html';
    }

    (async () => {
      user = await requireAuth();
      if (!user) return;
      renderStep();
    })();
  </script>
</body>
</html>
