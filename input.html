<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YakYak — Listen &amp; read</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="lesson-wrap">
    <div class="lesson-top">
      <button class="icon-btn" id="exitBtn">✕</button>
      <span class="text-faint" id="topLabel" style="font-size:12.5px;"></span>
    </div>
    <div id="inputBody"></div>
  </div>

  <script src="supabase-client.js"></script>
  <script>
    let user = null, profile = null, kind = null, passage = null, passageId = null;
    let quizIndex = 0, picked = null, correctCount = 0, revealed = false;

    function renderPicker() {
      document.getElementById('topLabel').textContent = '';
      document.getElementById('inputBody').innerHTML = `
        <div class="lesson-body">
          <h1 style="font-size:24px;margin-bottom:6px;">Listen or read?</h1>
          <p class="text-dim" style="font-size:14px;margin-bottom:20px;">Same idea either way — a short passage at your level, then a quick check.</p>
          <div style="display:flex;flex-direction:column;gap:10px;">
            <button class="row-option" id="pickReading"><span style="font-weight:700;">📖 Reading</span><span class="text-faint" style="font-size:12.5px;">Read a short passage</span></button>
            <button class="row-option" id="pickListening"><span style="font-weight:700;">🎧 Listening</span><span class="text-faint" style="font-size:12.5px;">Listen, transcript hidden by default</span></button>
          </div>
        </div>`;
      document.getElementById('pickReading').addEventListener('click', () => loadPassage('reading'));
      document.getElementById('pickListening').addEventListener('click', () => loadPassage('listening'));
    }

    function renderLoading() {
      document.getElementById('inputBody').innerHTML = `
        <div class="lesson-center">
          <div id="mascotSlot" style="width:52px;"></div>
          <p class="text-dim" style="margin-top:16px;font-size:14.5px;">Yak is writing something for you…</p>
        </div>`;
      document.getElementById('mascotSlot').innerHTML = mascotHTML(52);
    }

    function renderError(message) {
      document.getElementById('inputBody').innerHTML = `
        <div class="lesson-center error-box">
          <div style="font-size:30px;">⚠️</div>
          <p style="font-weight:700;">Couldn't generate this</p>
          <p class="text-faint" style="font-size:12.5px;max-width:320px;">${message}</p>
          <button class="btn-primary" id="retryBtn" style="margin-top:8px;">↻ Try again</button>
        </div>`;
      document.getElementById('retryBtn').addEventListener('click', () => loadPassage(kind));
    }

    async function loadPassage(k) {
      kind = k;
      renderLoading();
      try {
        const token = await getAuthToken();
        const res = await fetch(INPUT_PASSAGE_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body: JSON.stringify({
            targetLanguage: langByCode(profile.target_language).name,
            nativeLanguage: profile.native_language,
            level: profile.current_level,
            interest: profile.interests[0] || 'daily life',
            kind,
          }),
        });
        const raw = await res.text();
        if (!raw) throw new Error('Empty response (HTTP ' + res.status + ')');
        const data = JSON.parse(raw);
        if (!res.ok || data.error) throw new Error(data.error || ('HTTP ' + res.status));
        passage = data;

        const { data: row } = await db.from('input_passages').insert({
          target_language: profile.target_language,
          native_language: profile.native_language,
          level: profile.current_level,
          kind,
          title: data.title,
          body: data.body,
          comprehension_questions: data.questions,
          interest_tag: profile.interests[0] || null,
        }).select('id').single();
        passageId = row ? row.id : null;

        revealed = kind === 'reading';
        renderPassage();
      } catch (e) {
        renderError(e.message || 'Unknown error');
      }
    }

    function renderPassage() {
      document.getElementById('topLabel').textContent = passage.title;
      const tts = langByCode(profile.target_language).tts;
      document.getElementById('inputBody').innerHTML = `
        <div class="lesson-body">
          <span class="chip-mini">${kind === 'listening' ? '🎧 Listening' : '📖 Reading'}</span>
          <div class="card" style="margin-top:14px;">
            ${kind === 'listening' ? `
              <button class="btn-primary" id="playBtn" style="margin-bottom:14px;">🔊 Play</button>
              <div id="passageText" style="${revealed ? '' : 'display:none;'}font-size:15px;line-height:1.6;">${passage.body}</div>
              <button class="btn-ghost" id="revealBtn" style="${revealed ? 'display:none;' : ''}">Show transcript</button>
            ` : `<div style="font-size:15px;line-height:1.6;">${passage.body}</div>`}
          </div>
          <button class="btn-primary" id="continueBtn" style="margin-top:20px;width:100%;justify-content:center;">Comprehension check →</button>
        </div>`;

      if (kind === 'listening') {
        document.getElementById('playBtn').addEventListener('click', () => speak(passage.body, tts));
        const revealBtn = document.getElementById('revealBtn');
        if (revealBtn) revealBtn.addEventListener('click', () => { revealed = true; renderPassage(); });
      }
      document.getElementById('continueBtn').addEventListener('click', () => { quizIndex = 0; correctCount = 0; renderQuiz(); });
    }

    function renderQuiz() {
      picked = null;
      const q = passage.questions[quizIndex];
      document.getElementById('topLabel').textContent = `Question ${quizIndex + 1} of ${passage.questions.length}`;
      document.getElementById('inputBody').innerHTML = `
        <div class="lesson-body">
          <h2 style="font-size:21px;margin-bottom:18px;">${q.question}</h2>
          <div style="display:flex;flex-direction:column;gap:10px;" id="optionsList"></div>
          <div id="nextQBtn"></div>
        </div>`;
      const list = document.getElementById('optionsList');
      list.innerHTML = q.options.map((opt, i) => `<button class="option" data-i="${i}">${opt}</button>`).join('');
      list.querySelectorAll('.option').forEach(btn => {
        btn.addEventListener('click', () => {
          if (picked !== null) return;
          picked = parseInt(btn.dataset.i);
          if (picked === q.answerIndex) correctCount++;
          list.querySelectorAll('.option').forEach(b => {
            const i = parseInt(b.dataset.i);
            b.disabled = true;
            if (i === q.answerIndex) b.classList.add('correct');
            else if (i === picked) b.classList.add('wrong');
          });
          document.getElementById('nextQBtn').innerHTML = `<button class="btn-primary" id="nextBtn" style="margin-top:20px;width:100%;justify-content:center;">${quizIndex + 1 < passage.questions.length ? 'Next question' : 'Finish'} →</button>`;
          document.getElementById('nextBtn').addEventListener('click', () => {
            if (quizIndex + 1 < passage.questions.length) { quizIndex++; renderQuiz(); }
            else finish();
          });
        });
      });
    }

    async function finish() {
      const xpEarned = 15 + correctCount * 8;
      document.getElementById('inputBody').innerHTML = `
        <div class="lesson-center">
          <div style="font-size:40px;">🏆</div>
          <h2 style="font-size:24px;margin:14px 0 4px;">Nice work</h2>
          <p class="text-dim" style="font-size:14.5px;margin-bottom:20px;">${correctCount} of ${passage.questions.length} correct</p>
          <button class="btn-primary" id="doneBtn">Back to home →</button>
        </div>`;

      if (passageId) {
        await db.from('input_completions').insert({
          user_id: user.id, passage_id: passageId, score: correctCount, xp_earned: xpEarned,
        });
      }
      const today = new Date().toISOString().slice(0, 10);
      const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
      const newStreak = profile.last_activity_date === today ? profile.streak
        : profile.last_activity_date === yesterday ? profile.streak + 1 : 1;
      await db.from('profiles').update({
        xp: profile.xp + xpEarned, streak: newStreak, last_activity_date: today,
      }).eq('id', user.id);

      document.getElementById('doneBtn').addEventListener('click', () => { window.location.href = 'dashboard.html'; });
    }

    document.getElementById('exitBtn').addEventListener('click', () => { window.location.href = 'dashboard.html'; });

    (async () => {
      user = await requireAuth();
      if (!user) return;
      profile = await getProfile(user.id);
      if (!profile || !profile.name) { window.location.href = 'onboarding.html'; return; }
      renderPicker();
    })();
  </script>
</body>
</html>
