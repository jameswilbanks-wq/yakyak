<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YakYak — Listen &amp; read</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="lesson-wrap">
    <div class="lesson-top">
      <button class="icon-btn" id="exitBtn">✕</button>
      <span class="text-faint" id="topLabel" style="font-size:12.5px;"></span>
    </div>
    <div id="inputBody"></div>
  </div>

  <script src="supabase-client.js"></script>
  <script src="i18n.js"></script>
  <script>
    let user = null, profile = null, kind = null, passage = null, passageId = null;
    let sIdx = 0, sentenceResults = [], playedOnce = false;
    let recognition = null, isRecording = false;
    let mediaRecorder = null, mediaStream = null, audioChunks = [], liveTranscript = '';
    let activeMicBtn = null, activeHint = null, activeTargetText = null, activeOnGraded = null;

    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    const micSupported = !!SR;

    function renderPicker() {
      document.getElementById('topLabel').textContent = '';
      document.getElementById('inputBody').innerHTML = `
        <div class="lesson-body">
          <h1 style="font-size:24px;margin-bottom:6px;">${t('in.listenOrRead')}</h1>
          <p class="text-dim" style="font-size:14px;margin-bottom:20px;">${t('in.eitherWay')}</p>
          <div style="display:flex;flex-direction:column;gap:10px;">
            <button class="row-option" id="pickReading"><span style="font-weight:700;">📖 ${t('in.reading')}</span><span class="text-faint" style="font-size:12.5px;">${t('in.seeItReadIt')}</span></button>
            <button class="row-option" id="pickListening"><span style="font-weight:700;">🎧 ${t('in.listening')}</span><span class="text-faint" style="font-size:12.5px;">${t('in.hearItSayBack')}</span></button>
          </div>
          ${!micSupported ? `<p class="text-faint" style="font-size:11.5px;margin-top:16px;">${t('in.noMicSupport')}</p>` : ''}
        </div>`;
      document.getElementById('pickReading').addEventListener('click', () => loadPassage('reading'));
      document.getElementById('pickListening').addEventListener('click', () => loadPassage('listening'));
    }

    function renderLoading() {
      document.getElementById('inputBody').innerHTML = `
        <div class="lesson-center">
          <div id="mascotSlot" style="width:52px;"></div>
          <p class="text-dim" style="margin-top:16px;font-size:14.5px;">${t('in.writingSomething')}</p>
        </div>`;
      document.getElementById('mascotSlot').innerHTML = mascotHTML(52);
    }

    function renderError(message) {
      document.getElementById('inputBody').innerHTML = `
        <div class="lesson-center error-box">
          <div style="font-size:30px;">⚠️</div>
          <p style="font-weight:700;">${t('in.couldntGenerate')}</p>
          <p class="text-faint" style="font-size:12.5px;max-width:320px;">${message}</p>
          <button class="btn-primary" id="retryBtn" style="margin-top:8px;">${t('ls.tryAgain')}</button>
        </div>`;
      document.getElementById('retryBtn').addEventListener('click', () => loadPassage(kind));
    }

    async function loadPassage(k) {
      kind = k;
      renderLoading();
      try {
        const token = await getAuthToken();
        const res = await fetch(INPUT_PASSAGE_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body: JSON.stringify({
            targetLanguage: langByCode(profile.target_language).name,
            nativeLanguage: profile.native_language,
            level: profile.current_level,
            interest: profile.interests[0] || 'daily life',
            kind,
          }),
        });
        const raw = await res.text();
        if (!raw) throw new Error('Empty response (HTTP ' + res.status + ')');
        const data = JSON.parse(raw);
        if (!res.ok || data.error) throw new Error(data.error || ('HTTP ' + res.status));
        if (!data.sentences || !data.sentences.length) throw new Error('No sentences returned');
        passage = data;

        const { data: row } = await db.from('input_passages').insert({
          target_language: profile.target_language,
          native_language: profile.native_language,
          level: profile.current_level,
          kind,
          title: data.title,
          body: data.body,
          sentences: data.sentences,
          comprehension_questions: data.questions || [],
          interest_tag: profile.interests[0] || null,
        }).select('id').single();
        passageId = row ? row.id : null;

        sIdx = 0;
        sentenceResults = [];
        renderReadStep();
      } catch (e) {
        renderError(e.message || 'Unknown error');
      }
    }

    function renderProgress() {
      const total = passage.sentences.length;
      return `<div class="sentence-progress" style="margin-bottom:16px;">${passage.sentences.map((_, i) =>
        `<div class="seg${i < sIdx ? ' done' : i === sIdx ? ' current' : ''}"></div>`).join('')}</div>`;
    }

    function renderReadStep() {
      playedOnce = false;
      isRecording = false;
      const sentence = passage.sentences[sIdx];
      const tts = langByCode(profile.target_language).tts;
      document.getElementById('topLabel').textContent = t('in.sentenceOfTotal', { i: sIdx + 1, n: passage.sentences.length });

      const showText = kind === 'reading';
      document.getElementById('inputBody').innerHTML = `
        <div class="lesson-body">
          ${renderProgress()}
          <span class="chip-mini">${kind === 'listening' ? t('in.listenSayBack') : t('in.readAloud')}</span>
          <div class="card" style="margin-top:14px;min-height:90px;display:flex;align-items:center;justify-content:center;text-align:center;">
            ${showText
              ? `<p style="font-size:19px;font-weight:700;font-family:var(--font-display);">${sentence.target}</p>`
              : `<div id="listenSlot">
                   <button class="btn-primary" id="playBtn">${t('in.playSentence')}</button>
                   <p class="text-faint" style="font-size:11.5px;margin-top:10px;">${t('in.tapPlayListen')}</p>
                 </div>`}
          </div>
          <div style="margin-top:28px;text-align:center;" id="micArea">
            ${micSupported ? `
              <button class="mic-btn" id="micBtn" ${showText ? '' : 'disabled'}>🎙️</button>
              <p class="text-faint" style="font-size:12px;margin-top:10px;" id="micHint">${showText ? t('in.tapAndRead') : t('in.playFirst')}</p>
            ` : `
              <button class="btn-primary" id="skipMicBtn">${t('in.continueArrow')}</button>
              <p class="text-faint" style="font-size:11.5px;margin-top:10px;">${t('in.pronScoringUnavailable')}</p>
            `}
          </div>
        </div>`;

      if (!showText) {
        document.getElementById('playBtn').addEventListener('click', () => {
          speak(sentence.target, tts);
          playedOnce = true;
          const micBtn = document.getElementById('micBtn');
          if (micBtn) {
            micBtn.disabled = false;
            document.getElementById('micHint').textContent = t('in.nowTapSay');
          }
        });
      }

      if (micSupported) {
        document.getElementById('micBtn').addEventListener('click', () => {
          const micBtn = document.getElementById('micBtn');
          const hint = document.getElementById('micHint');
          toggleRecording(micBtn, hint, sentence.target, (transcript, audioURL) => gradePronunciation(sentence.target, transcript, audioURL));
        });
      } else {
        document.getElementById('skipMicBtn').addEventListener('click', () => {
          sentenceResults[sIdx] = { pronScore: null, pronFeedback: null };
          renderComprehendStep();
        });
      }
    }

    // Generalized recording controls — used both for the main sentence-level
    // mic button and for per-word retry mic buttons in the "words to
    // practice" list. `targetText` is whatever is being read (a full
    // sentence or a single word); `onGraded(transcript, audioURL)` fires once
    // both the transcript and the playable audio blob are ready.
    async function toggleRecording(micBtn, hint, targetText, onGraded) {
      if (isRecording) {
        stopRecording();
        return;
      }
      await startRecording(micBtn, hint, targetText, onGraded);
    }

    // Recording stays open until the learner taps the button again — no
    // auto-stop on a pause. Captures raw audio (MediaRecorder, for
    // play-back) alongside a running speech-recognition transcript (for
    // grading), in parallel.
    async function startRecording(micBtn, hint, targetText, onGraded) {
      const tts = langByCode(profile.target_language).tts;
      audioChunks = [];
      liveTranscript = '';
      activeMicBtn = micBtn;
      activeHint = hint;
      activeTargetText = targetText;
      activeOnGraded = onGraded;

      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      } catch (e) {
        hint.textContent = t('in.micPermissionError');
        return;
      }

      mediaRecorder = new MediaRecorder(mediaStream);
      mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data); };
      mediaRecorder.start();

      recognition = new SR();
      recognition.lang = tts;
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.maxAlternatives = 1;
      recognition.onresult = (e) => {
        let tr = '';
        for (let i = 0; i < e.results.length; i++) tr += e.results[i][0].transcript;
        liveTranscript = tr;
      };
      recognition.onerror = () => {}; // keep going — whatever we've captured is used when the learner stops
      recognition.start();

      isRecording = true;
      micBtn.classList.add('recording');
      micBtn.textContent = '⏹️';
      hint.textContent = t('in.recordingTapStop');
    }

    function stopRecording() {
      const micBtn = activeMicBtn;
      const hint = activeHint;
      const targetText = activeTargetText;
      const onGraded = activeOnGraded;
      isRecording = false;
      micBtn.classList.remove('recording');
      micBtn.textContent = '🎙️';
      micBtn.disabled = true;
      hint.textContent = t('in.processing');

      let recognitionDone = false, recorderDone = false, audioURL = null;
      const maybeFinish = () => {
        if (recognitionDone && recorderDone) onGraded(liveTranscript, audioURL);
      };

      if (recognition) {
        recognition.onend = () => { recognitionDone = true; maybeFinish(); };
        try { recognition.stop(); } catch (e) { recognitionDone = true; maybeFinish(); }
      } else {
        recognitionDone = true;
      }

      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.onstop = () => {
          const blob = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
          audioURL = URL.createObjectURL(blob);
          if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
          recorderDone = true;
          maybeFinish();
        };
        try { mediaRecorder.stop(); } catch (e) { recorderDone = true; maybeFinish(); }
      } else {
        recorderDone = true;
      }
    }

    async function gradePronunciation(targetSentence, transcript, audioURL) {
      document.getElementById('micArea').innerHTML = `
        <div class="lesson-center" style="padding:10px 0;">
          <div id="mascotSlot" style="width:36px;"></div>
          <p class="text-dim" style="margin-top:10px;font-size:13px;">${t('in.gradingReading')}</p>
        </div>`;
      document.getElementById('mascotSlot').innerHTML = mascotHTML(36);

      let result;
      try {
        const token = await getAuthToken();
        const res = await fetch(GRADE_PRONUNCIATION_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body: JSON.stringify({
            targetSentence,
            transcript,
            targetLanguage: langByCode(profile.target_language).name,
            nativeLanguage: profile.native_language,
          }),
        });
        const raw = await res.text();
        const data = JSON.parse(raw);
        if (!res.ok || data.error) throw new Error(data.error || ('HTTP ' + res.status));
        result = data;
      } catch (e) {
        result = { score: null, isGood: null, feedback: "Couldn't reach the grader (" + (e.message || 'error') + '). Moving on.', missedWords: [] };
      }

      sentenceResults[sIdx] = {
        pronScore: result.score,
        pronFeedback: result.feedback,
        heard: transcript,
        audioURL,
        missedWords: Array.isArray(result.missedWords) ? result.missedWords : [],
        wordPractice: {},
      };
      renderPronFeedback();
    }

    // Grades a single retried word (targetSentence with one word makes the
    // edge function skip missedWords detection and just score the word).
    async function gradeWordPronunciation(word, transcript, audioURL, words, tts) {
      const r = sentenceResults[sIdx];
      let result;
      try {
        const token = await getAuthToken();
        const res = await fetch(GRADE_PRONUNCIATION_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body: JSON.stringify({
            targetSentence: word,
            transcript,
            targetLanguage: langByCode(profile.target_language).name,
            nativeLanguage: profile.native_language,
          }),
        });
        const raw = await res.text();
        const data = JSON.parse(raw);
        if (!res.ok || data.error) throw new Error(data.error || ('HTTP ' + res.status));
        result = data;
      } catch (e) {
        result = { score: null, isGood: null, feedback: '' };
      }
      r.wordPractice[word] = { score: result.score, audioURL };
      renderWordPracticeList(words, tts);
    }

    function renderPronFeedback() {
      const sentence = passage.sentences[sIdx];
      const r = sentenceResults[sIdx];
      const tts = langByCode(profile.target_language).tts;
      const good = r.pronScore === null ? null : r.pronScore >= 75;
      const missedWords = (r.missedWords || []).slice(0, 4);
      document.getElementById('inputBody').innerHTML = `
        <div class="lesson-body">
          ${renderProgress()}
          <div style="display:flex;align-items:center;gap:14px;">
            ${r.pronScore !== null ? `<div class="score-badge ${good ? 'good' : 'bad'}">${r.pronScore}</div>` : ''}
            <div>
              <p style="font-weight:800;">${r.pronScore === null ? t('in.skipped') : good ? t('in.niceReading') : t('in.worthAnotherLook')}</p>
              <p class="text-dim" style="font-size:13px;margin-top:2px;">${r.pronFeedback || ''}</p>
            </div>
          </div>
          <div class="card" style="margin-top:16px;">
            <p style="font-size:16px;font-weight:700;font-family:var(--font-display);">${sentence.target}</p>
            ${r.heard ? `<p class="text-faint" style="font-size:12px;margin-top:8px;">${t('in.weHeard')} "${r.heard}"</p>` : ''}
          </div>
          <div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;">
            <button class="btn-ghost" id="hearCorrectBtn">${t('in.hearCorrect')}</button>
            ${r.audioURL ? `<button class="btn-ghost" id="hearMineBtn">${t('in.hearMine')}</button>` : ''}
          </div>
          ${missedWords.length ? `
            <div class="card" style="margin-top:18px;">
              <span class="label" style="margin-bottom:4px;">${t('in.wordsToPractice')}</span>
              <div id="wordPracticeList"></div>
            </div>` : ''}
          <div style="display:flex;gap:10px;margin-top:22px;">
            <button class="btn-ghost" id="retryReadBtn">${t('in.retry')}</button>
            <button class="btn-primary" id="toComprehendBtn" style="flex:1;justify-content:center;">${t('in.continueArrow')}</button>
          </div>
        </div>`;
      document.getElementById('hearCorrectBtn').addEventListener('click', () => speak(sentence.target, tts));
      if (r.audioURL) {
        document.getElementById('hearMineBtn').addEventListener('click', () => { new Audio(r.audioURL).play(); });
      }
      document.getElementById('retryReadBtn').addEventListener('click', renderReadStep);
      document.getElementById('toComprehendBtn').addEventListener('click', renderComprehendStep);

      if (missedWords.length) renderWordPracticeList(missedWords, tts);
    }

    // Renders (and re-renders, after each per-word retry) the list of
    // mispronounced words with a repeatable "hear it" button and an
    // optional per-word mic to retry just that one word. Entirely optional —
    // the main Continue/Retry-sentence buttons above are unaffected.
    function renderWordPracticeList(words, tts) {
      const r = sentenceResults[sIdx];
      const list = document.getElementById('wordPracticeList');
      if (!list) return;
      list.innerHTML = words.map((w, i) => {
        const wp = r.wordPractice[w];
        const passed = wp && wp.score !== null && wp.score >= 75;
        const scoreNote = passed
          ? `<span class="text-faint" style="font-size:11.5px;color:var(--mint);">✓ ${t('in.wordPassed')}</span>`
          : (wp && wp.score !== null ? `<span class="text-faint" style="font-size:11.5px;">${wp.score}</span>` : '');
        return `
          <div class="word-practice-row">
            <div style="display:flex;align-items:center;gap:8px;flex:1;min-width:0;">
              <span style="font-weight:700;font-family:var(--font-display);font-size:15px;">${w}</span>
              ${scoreNote}
            </div>
            <div style="display:flex;align-items:center;gap:6px;">
              <button class="btn-ghost" data-word-hear="${i}" style="padding:4px 10px;font-size:12px;">🔊</button>
              ${micSupported ? `<button class="mic-btn-sm" data-word-mic="${i}">🎙️</button>` : ''}
            </div>
          </div>
          ${micSupported ? `<p class="text-faint" id="wordHint${i}" style="font-size:11px;margin:2px 0 6px;">${t('in.wordRecordHint')}</p>` : ''}
        `;
      }).join('');

      words.forEach((w, i) => {
        list.querySelector(`[data-word-hear="${i}"]`).addEventListener('click', () => speak(w, tts));
        const micBtn = list.querySelector(`[data-word-mic="${i}"]`);
        if (micBtn) {
          const hint = document.getElementById('wordHint' + i);
          micBtn.addEventListener('click', () => {
            toggleRecording(micBtn, hint, w, (transcript, audioURL) => gradeWordPronunciation(w, transcript, audioURL, words, tts));
          });
        }
      });
    }

    function renderComprehendStep() {
      const sentence = passage.sentences[sIdx];
      document.getElementById('inputBody').innerHTML = `
        <div class="lesson-body">
          ${renderProgress()}
          <div class="card" style="margin-bottom:18px;">
            <p style="font-size:16px;font-weight:700;font-family:var(--font-display);">${sentence.target}</p>
          </div>
          <label class="label">${t('in.whatDoesMean', { lang: nativeLangDisplay(profile.native_language) })}</label>
          <textarea id="compInput" class="input" rows="3" style="resize:none;" placeholder="${t('in.typeHere')}"></textarea>
          <button class="btn-primary" id="compSubmitBtn" style="margin-top:18px;width:100%;justify-content:center;" disabled>${t('in.check')}</button>
          <div id="compFeedbackSlot" style="margin-top:16px;"></div>
        </div>`;

      const input = document.getElementById('compInput');
      const submitBtn = document.getElementById('compSubmitBtn');
      let submitted = false;
      input.addEventListener('input', () => { submitBtn.disabled = input.value.trim().length === 0; });
      submitBtn.addEventListener('click', async () => {
        if (submitted) { nextSentence(); return; }
        const answer = input.value.trim();
        submitBtn.disabled = true;
        submitBtn.textContent = t('in.checking');
        input.disabled = true;

        let result;
        try {
          const token = await getAuthToken();
          const res = await fetch(TRANSLATE_GRADE_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
            body: JSON.stringify({
              sourceText: sentence.target,
              expectedText: sentence.native,
              userAnswer: answer,
              targetLanguage: langByCode(profile.target_language).name,
              nativeLanguage: profile.native_language,
              grammarLabel: passage.title,
            }),
          });
          const raw = await res.text();
          const data = JSON.parse(raw);
          if (!res.ok || data.error) throw new Error(data.error || ('HTTP ' + res.status));
          result = data;
        } catch (e) {
          result = { isCorrect: null, feedback: "Couldn't reach the grader (" + (e.message || 'error') + '). Moving on.' };
        }

        submitted = true;
        sentenceResults[sIdx].comprehensionCorrect = result.isCorrect === true;

        const good = result.isCorrect;
        document.getElementById('compFeedbackSlot').innerHTML = `
          <div class="feedback-box ${good === null ? '' : good ? 'correct' : 'wrong'}">
            <p style="font-weight:800;">${good === null ? t('in.skipped') : good ? t('in.gotIt') : t('in.notQuite')}</p>
            <p class="text-dim" style="font-size:13.5px;margin-top:4px;">${result.feedback || ''}</p>
            <p class="text-faint" style="font-size:12px;margin-top:8px;">${t('in.fullMeaning')} <b style="color:var(--text);">${sentence.native}</b></p>
          </div>
          ${grammarLessonHTML(result)}`;
        saveGrammarLesson(user.id, profile.target_language, profile.current_level, result);

        submitBtn.disabled = false;
        submitBtn.textContent = sIdx + 1 < passage.sentences.length ? t('in.nextSentence') : t('in.finish');
      });
    }

    function nextSentence() {
      if (sIdx + 1 < passage.sentences.length) { sIdx++; renderReadStep(); }
      else finish();
    }

    async function finish() {
      const scored = sentenceResults.filter(r => r.pronScore !== null && r.pronScore !== undefined);
      const avgPron = scored.length ? Math.round(scored.reduce((s, r) => s + r.pronScore, 0) / scored.length) : null;
      const compCorrect = sentenceResults.filter(r => r.comprehensionCorrect).length;
      const total = sentenceResults.length;
      const xpEarned = 15 + compCorrect * 8 + (avgPron !== null ? Math.round(avgPron / 10) : 0);

      document.getElementById('topLabel').textContent = '';
      document.getElementById('inputBody').innerHTML = `
        <div class="lesson-center">
          <div style="font-size:40px;">🏆</div>
          <h2 style="font-size:24px;margin:14px 0 4px;">${t('in.niceWorkTitle')}</h2>
          <p class="text-dim" style="font-size:14.5px;">${t('in.understoodOfTotal', { c: compCorrect, t: total })}${avgPron !== null ? ` · ${t('in.pronAvg', { n: avgPron })}` : ''}</p>
          <button class="btn-primary" id="doneBtn" style="margin-top:20px;">${t('in.backToHome')}</button>
        </div>`;

      if (passageId) {
        await db.from('input_completions').insert({
          user_id: user.id, passage_id: passageId, score: compCorrect, xp_earned: xpEarned, pronunciation_avg: avgPron,
        });
      }
      const today = new Date().toISOString().slice(0, 10);
      const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
      const newStreak = profile.last_activity_date === today ? profile.streak
        : profile.last_activity_date === yesterday ? profile.streak + 1 : 1;
      await db.from('profiles').update({
        xp: profile.xp + xpEarned, streak: newStreak, last_activity_date: today,
      }).eq('id', user.id);

      document.getElementById('doneBtn').addEventListener('click', () => { window.location.href = 'dashboard.html'; });
    }

    document.getElementById('exitBtn').addEventListener('click', () => {
      if (recognition) { try { recognition.stop(); } catch (e) {} }
      if (mediaRecorder && mediaRecorder.state !== 'inactive') { try { mediaRecorder.stop(); } catch (e) {} }
      if (mediaStream) { try { mediaStream.getTracks().forEach(t => t.stop()); } catch (e) {} }
      window.location.href = 'dashboard.html';
    });

    (async () => {
      user = await requireAuth();
      if (!user) return;
      profile = await getProfile(user.id);
      if (!profile || !profile.name) { window.location.href = 'onboarding.html'; return; }
      setLocale(profile.native_language);
      renderPicker();
    })();
  </script>
</body>
</html>
