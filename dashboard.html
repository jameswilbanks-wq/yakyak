<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YakYak</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="dash-wrap">
    <div class="dash-content" id="dashContent">
      <p class="text-dim" id="loadingLabel">Loading…</p>
    </div>
    <div class="bottom-nav">
      <a class="nav-item active" href="dashboard.html" id="navHome">🏠<span>Home</span></a>
      <a class="nav-item" href="review.html" id="navProgress">📊<span>Progress</span></a>
      <a class="nav-item" href="roleplay.html" id="navTalk">💬<span>Talk</span></a>
      <a class="nav-item" href="basecamp.html" id="navBasecamp">🏕️<span>Basecamp</span></a>
      <button class="nav-item" id="signOutBtn" style="cursor:pointer;">👤<span id="navSignoutLabel">Sign out</span></button>
    </div>
  </div>

  <script src="supabase-client.js"></script>
  <script src="i18n.js"></script>
  <script>
    const MODULE_INFO = {
      vocab: { icon: '📚', nameKey: 'db.vocabChip' },
      translate: { icon: '🔤', nameKey: 'db.translateDiagnose' },
      roleplay: { icon: '🗣️', nameKey: 'db.naturalDialogChip' },
      input: { icon: '📖', nameKey: 'db.listenRead' },
    };

    let user = null, profile = null, completionCount = 0, vocabProgress = { learned: 0, target: 1000 }, myBadgeCodes = [];

    function openProgressModal(profile) {
      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      const hasAssessment = !!profile.assessed_level;
      overlay.innerHTML = `
        <div class="modal-card">
          <h2 style="font-size:20px;margin-bottom:4px;">${t('lvl.modalTitle')}</h2>
          ${hasAssessment ? `
            <p style="font-weight:800;font-size:17px;margin:10px 0 6px;color:var(--accent-ink);">${tierLabel(profile.assessed_level)}</p>
            <p class="text-dim" style="font-size:13.5px;line-height:1.5;">${profile.assessed_reasoning || ''}</p>
            ${(profile.assessed_focus_areas && profile.assessed_focus_areas.length) ? `
              <p class="label" style="margin-top:16px;">${t('lvl.focusOn')}</p>
              <ul style="margin:0;padding-left:18px;">
                ${profile.assessed_focus_areas.map(f => `<li class="text-dim" style="font-size:13px;margin-top:2px;">${f}</li>`).join('')}
              </ul>` : ''}
          ` : `
            <p class="text-dim" style="font-size:13.5px;margin-top:10px;">${t('lvl.gatheringHint')}</p>
            <p class="text-faint" style="font-size:12px;margin-top:8px;">${t('lvl.gathering', { n: Math.min(profile.total_activities || 0, FIRST_EVAL_MIN_ACTIVITIES), total: FIRST_EVAL_MIN_ACTIVITIES })}</p>
          `}
          <button class="btn-primary" id="closeProgressModalBtn" style="margin-top:20px;width:100%;justify-content:center;">${t('lvl.close')}</button>
        </div>`;
      document.body.appendChild(overlay);
      document.getElementById('closeProgressModalBtn').addEventListener('click', () => overlay.remove());
      overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
    }

    function renderHeader() {
      document.getElementById('dashContent').innerHTML = `
        <div style="display:flex;align-items:center;gap:7px;margin-bottom:14px;">
          <div class="mascot" style="width:20px;height:20px;">
            <div class="eyes" style="gap:3.6px;"><div class="eye" style="width:2px;height:2px;"></div><div class="eye" style="width:2px;height:2px;"></div></div>
            <div class="smile" style="bottom:4.8px;width:5.6px;height:2.8px;border-bottom-width:2px;"></div>
          </div>
          <span style="font-weight:800;font-size:13px;color:var(--accent-ink);letter-spacing:.2px;">YakYak</span>
        </div>
        <div id="coachSlot"></div>
        <div id="cheerBannerSlot"></div>
        <div class="dash-header">
          <div style="display:flex;align-items:center;gap:10px;">
            <button id="avatarBtn" title="${t('ev.viewEvolution')}" style="width:76px;height:auto;background:none;border:none;padding:0;cursor:pointer;flex-shrink:0;"></button>
            <div>
              <h1 style="font-size:22px;">${greeting()}, ${profile.name}.</h1>
              <p class="text-faint" style="font-size:12.5px;">${profile.current_level} → ${profile.target_level}</p>
            </div>
          </div>
          <div style="display:flex;gap:8px;">
            <div class="stat-pill">🔥 <span>${profile.streak}</span></div>
            <div class="stat-pill">✨ <span>${profile.xp}</span></div>
          </div>
        </div>

        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap;">
          <span class="chip-mini" id="tierBadge" style="background:var(--mint-soft);color:var(--mint);"></span>
          <button class="btn-ghost" id="evaluateBtn">🎯 ${t('lvl.evaluateBtn')}</button>
        </div>

        <div id="levelTestBannerSlot"></div>
        <div id="mainSlot"></div>
      `;
      document.getElementById('avatarBtn').innerHTML = yakAvatarHTML(currentEvolutionStage(profile.xp).avatarId, 76, myBadgeCodes);
      document.getElementById('avatarBtn').addEventListener('click', () => { window.location.href = 'evolution.html'; });
      document.getElementById('tierBadge').textContent = profile.assessed_level
        ? tierLabel(profile.assessed_level)
        : t('lvl.gathering', { n: Math.min(profile.total_activities || 0, FIRST_EVAL_MIN_ACTIVITIES), total: FIRST_EVAL_MIN_ACTIVITIES });
      document.getElementById('evaluateBtn').addEventListener('click', () => openProgressModal(profile));
      renderLevelTestBanner();
    }

    // Shown only when the learner is actually eligible (see
    // levelTestEligibility() in supabase-client.js — gated on already
    // being at this level's Advanced sub-tier) or on cooldown after a
    // recent attempt. Silent otherwise, so most visits show nothing here.
    function renderLevelTestBanner() {
      const slot = document.getElementById('levelTestBannerSlot');
      const elig = levelTestEligibility(profile);
      if (elig.eligible) {
        slot.innerHTML = `
          <a href="level-test.html" class="card" style="margin-bottom:14px;display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--text);border:1px solid var(--accent);background:var(--accent-soft);">
            <div style="font-size:24px;">🏆</div>
            <div style="flex:1;">
              <div style="font-weight:800;font-size:14px;color:var(--accent-ink);">${t('lvt.dashBannerTitle')}</div>
              <div class="text-faint" style="font-size:12px;margin-top:2px;">${t('lvt.dashBannerDesc', { level: profile.current_level, next: elig.nextLevel })}</div>
            </div>
            <div style="font-size:16px;color:var(--accent-ink);">→</div>
          </a>`;
      } else if (elig.reason === 'cooldown') {
        slot.innerHTML = `
          <div class="card" style="margin-bottom:14px;font-size:12.5px;">
            <span class="text-faint">⏳ ${t('lvt.dashBannerCooldownDesc', { n: formatHoursRemaining(elig.cooldownUntil) })}</span>
          </div>`;
      } else {
        slot.innerHTML = '';
      }
    }

    // Coach Yak: a fixed mascot persona (avatars/coach.png), distinct from
    // the learner's own Yak Evolution avatar. Fire-and-forget from the boot
    // sequence — never blocks the rest of the dashboard from rendering,
    // since the first-of-day version makes a real AI call (see
    // getDailyCoachCheckin in supabase-client.js). Shows a full generated
    // pep talk once per day, or a quick canned hype line on every later
    // visit that same day.
    async function renderCoachCard() {
      const slot = document.getElementById('coachSlot');
      const checkin = await getDailyCoachCheckin(user, profile);
      const size = checkin.isNew ? 54 : 38;
      const avatarImg = `
        <div class="yak-avatar-idle" style="width:${size}px;height:${size}px;border-radius:50%;overflow:hidden;background:var(--card-2);flex-shrink:0;">
          <img src="avatars/coach.png" style="width:114%;height:114%;object-fit:cover;" alt="Coach Yak">
        </div>`;
      if (checkin.isNew && checkin.message) {
        slot.innerHTML = `
          <div class="card" style="display:flex;gap:12px;align-items:center;margin-bottom:14px;background:var(--accent-soft);border-color:var(--accent);">
            ${avatarImg}
            <p style="font-size:13.5px;line-height:1.5;">${escapeHtml(checkin.message)}</p>
          </div>`;
      } else {
        slot.innerHTML = `
          <div class="card" style="display:flex;align-items:center;gap:10px;margin-bottom:14px;padding:10px 14px;">
            ${avatarImg}
            <p style="font-size:13px;font-weight:700;">${randomHypePhrase()}</p>
          </div>`;
      }
    }

    // --- Step 1: à la carte vs. build-my-plan fork (shown every visit) ---
    function renderFork() {
      const slot = document.getElementById('mainSlot');
      slot.innerHTML = `
        <button class="card" id="forkPlanBtn" style="text-align:left;width:100%;cursor:pointer;border:1px solid var(--accent);">
          <span class="chip-mini">🤖 ${t('pl.forkPlanChip')}</span>
          <h2 style="font-size:20px;margin:8px 0 4px;">${t('pl.forkPlanTitle')}</h2>
          <p class="text-dim" style="font-size:13.5px;">${t('pl.forkPlanDesc')}</p>
        </button>
        <button class="card" id="forkCarteBtn" style="text-align:left;width:100%;cursor:pointer;margin-top:14px;">
          <span class="chip-mini" style="background:var(--mint-soft);color:var(--mint);">🍽️ ${t('pl.forkCarteChip')}</span>
          <h2 style="font-size:20px;margin:8px 0 4px;">${t('pl.forkCarteTitle')}</h2>
          <p class="text-dim" style="font-size:13.5px;">${t('pl.forkCarteDesc')}</p>
        </button>
      `;
      document.getElementById('forkPlanBtn').addEventListener('click', renderTimePicker);
      document.getElementById('forkCarteBtn').addEventListener('click', renderALaCarte);
    }

    // --- Step 2: pick a time budget -----------------------------------
    function renderTimePicker() {
      const slot = document.getElementById('mainSlot');
      let chosen = TIME_OPTIONS.some(o => o.id === profile.daily_minutes) ? profile.daily_minutes : null;
      slot.innerHTML = `
        <div class="lesson-body" style="padding:0;">
          <h1 style="font-size:22px;margin-bottom:6px;">${t('pl.howMuchTime')}</h1>
          <p class="text-dim" style="margin-bottom:18px;font-size:13.5px;">${t('pl.sizeToday')}</p>
          <div style="display:flex;flex-direction:column;gap:10px;" id="timeList"></div>
          <button class="btn-primary" id="buildPlanBtn" style="margin-top:20px;width:100%;justify-content:center;" ${chosen ? '' : 'disabled'}>${t('pl.buildMyPlan')}</button>
          <button class="btn-ghost" id="backToForkBtn" style="width:100%;justify-content:center;margin-top:8px;">${t('pl.back')}</button>
        </div>`;
      const draw = () => {
        document.getElementById('timeList').innerHTML = TIME_OPTIONS.map(opt => `
          <button class="row-option${chosen === opt.id ? ' active' : ''}" data-t="${opt.id}">
            <span style="font-weight:700;font-size:15px;font-family:var(--font-display);">${t(opt.key + '.label')}</span>
            <span class="text-faint" style="font-size:12.5px;">${t(opt.key + '.hint')}</span>
          </button>`).join('');
        document.querySelectorAll('#timeList .row-option').forEach(b => b.addEventListener('click', () => {
          chosen = parseInt(b.dataset.t);
          document.getElementById('buildPlanBtn').disabled = false;
          draw();
        }));
      };
      draw();
      document.getElementById('backToForkBtn').addEventListener('click', renderFork);
      document.getElementById('buildPlanBtn').addEventListener('click', () => buildPlan(chosen));
    }

    // --- Step 3: generate + preview the plan ----------------------------
    async function buildPlan(minutes) {
      const slot = document.getElementById('mainSlot');
      slot.innerHTML = `
        <div class="lesson-center" style="padding:40px 0;">
          <div id="mascotSlot2" style="width:52px;"></div>
          <p class="text-dim" style="margin-top:16px;font-size:14.5px;">${t('pl.building')}</p>
        </div>`;
      document.getElementById('mascotSlot2').innerHTML = mascotHTML(52);

      await db.from('profiles').update({ daily_minutes: minutes }).eq('id', user.id);
      profile.daily_minutes = minutes;

      try {
        const stats = await gatherProgressStats(user.id, profile.target_language);
        const token = await getAuthToken();
        const res = await fetch(GENERATE_PLAN_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body: JSON.stringify({
            targetLanguage: langByCode(profile.target_language).name,
            nativeLanguage: profile.native_language,
            level: profile.current_level,
            minutes,
            stats,
            focusAreas: profile.assessed_focus_areas || [],
          }),
        });
        const raw = await res.text();
        if (!raw) throw new Error('Empty response (HTTP ' + res.status + ')');
        const data = JSON.parse(raw);
        if (!res.ok || data.error) throw new Error(data.error || ('HTTP ' + res.status));
        if (!data.steps || !data.steps.length) throw new Error('No plan returned');
        renderPlanPreview(data, minutes);
      } catch (e) {
        slot.innerHTML = `
          <div class="lesson-center error-box" style="padding:30px 0;">
            <div style="font-size:30px;">⚠️</div>
            <p style="font-weight:700;">${t('pl.couldntBuild')}</p>
            <p class="text-faint" style="font-size:12.5px;max-width:320px;">${e.message || 'Unknown error'}</p>
            <button class="btn-primary" id="retryPlanBtn" style="margin-top:8px;">${t('ls.tryAgain')}</button>
          </div>`;
        document.getElementById('retryPlanBtn').addEventListener('click', () => buildPlan(minutes));
      }
    }

    function renderPlanPreview(data, minutes) {
      const slot = document.getElementById('mainSlot');
      slot.innerHTML = `
        <div class="lesson-body" style="padding:0;">
          <h1 style="font-size:22px;margin-bottom:6px;">${t('pl.todaysPlan')}</h1>
          <p class="text-dim" style="margin-bottom:18px;font-size:13.5px;">${data.summary || ''}</p>
          <div style="display:flex;flex-direction:column;gap:10px;" id="planStepsList"></div>
          <p class="text-faint" style="font-size:11.5px;margin-top:16px;">${t('pl.disclaimer')}</p>
          <button class="btn-primary" id="letsGoBtn" style="margin-top:16px;width:100%;justify-content:center;">${t('pl.letsGo')}</button>
          <button class="btn-ghost" id="backToTimeBtn" style="width:100%;justify-content:center;margin-top:8px;">${t('pl.back')}</button>
        </div>`;
      document.getElementById('planStepsList').innerHTML = data.steps.map((s, i) => {
        const info = MODULE_INFO[s.module] || { icon: '•', nameKey: '' };
        return `
        <div class="card" style="padding:12px 14px;">
          <div style="display:flex;align-items:center;gap:10px;">
            <span style="font-size:18px;">${info.icon}</span>
            <div style="flex:1;">
              <div style="font-weight:700;font-size:14px;">${i + 1}. ${info.nameKey ? t(info.nameKey) : s.module}</div>
              ${s.reason ? `<div class="text-faint" style="font-size:11.5px;margin-top:2px;">${s.reason}</div>` : ''}
            </div>
            <span class="chip-mini">${s.minutes} min</span>
          </div>
        </div>`;
      }).join('');
      document.getElementById('backToTimeBtn').addEventListener('click', () => renderTimePicker());
      document.getElementById('letsGoBtn').addEventListener('click', () => {
        saveActivePlan({ steps: data.steps, currentIndex: 0, totalXp: 0 });
        window.location.href = data.steps[0].module + '.html?plan=1';
      });
    }

    // --- à la carte: today's normal 4-card dashboard --------------------
    function renderALaCarte() {
      const slot = document.getElementById('mainSlot');
      const learning = langByCode(profile.target_language);
      slot.innerHTML = `
        <div class="card">
          <span class="chip-mini">🗣️ ${t('db.naturalDialogChip')}</span>
          <h2 style="font-size:22px;margin:8px 0 4px;">${t('db.naturalDialogTitle')}</h2>
          <p class="text-dim" style="font-size:13.5px;margin-bottom:18px;">${t('db.naturalDialogDesc', { lang: langDisplay(learning.code) })}</p>
          <button class="btn-primary" id="startLessonBtn">${t('db.startTalking')}</button>
        </div>

        <div class="card" style="margin-top:14px;">
          <span class="chip-mini" style="background:var(--mint-soft);color:var(--mint);">${t('db.translateDiagnose')}</span>
          <h2 style="font-size:20px;margin:8px 0 4px;">${t('db.translateWeakSpots')}</h2>
          <p class="text-dim" style="font-size:13.5px;margin-bottom:18px;">${t('db.sixSentences')}</p>
          <button class="btn-primary" id="startTranslateBtn">${t('db.startTranslating')}</button>
        </div>

        <div class="card" style="margin-top:14px;">
          <span class="chip-mini">${t('db.listenRead')}</span>
          <h2 style="font-size:20px;margin:8px 0 4px;">${t('db.comprehensibleInput')}</h2>
          <p class="text-dim" style="font-size:13.5px;margin-bottom:18px;">${t('db.shortPassage')}</p>
          <button class="btn-primary" id="startInputBtn">${t('db.startReadingListening')}</button>
        </div>

        <div class="card" style="margin-top:14px;">
          <span class="chip-mini" style="background:var(--mint-soft);color:var(--mint);">📖 ${t('db.readingChip')}</span>
          <h2 style="font-size:20px;margin:8px 0 4px;">${t('db.readingTitle')}</h2>
          <p class="text-dim" style="font-size:13.5px;margin-bottom:18px;">${t('db.readingDesc', { lang: langDisplay(learning.code) })}</p>
          <button class="btn-primary" id="startReadingBtn">${t('db.startReading')}</button>
        </div>

        <div class="card" style="margin-top:14px;">
          <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;">
            <span class="chip-mini" style="background:var(--mint-soft);color:var(--mint);">📚 ${t('db.vocabChip')}</span>
            <span class="text-faint" style="font-size:11px;">${t('db.vocabProgress', { learned: vocabProgress.learned, target: vocabProgress.target, level: profile.current_level })}</span>
          </div>
          <h2 style="font-size:20px;margin:8px 0 4px;">${t('db.vocabTitle')}</h2>
          <p class="text-dim" style="font-size:13.5px;margin-bottom:18px;">${t('db.vocabDesc', { lang: langDisplay(learning.code) })}</p>
          <button class="btn-primary" id="startVocabBtn">${t('db.startVocab')}</button>
        </div>

        <div class="card" style="margin-top:14px;">
          <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;">
            <span class="label" style="margin-bottom:0;">${t('db.yourPath')}</span>
            <span class="text-faint" style="font-size:11px;">${t('db.lessonsCompleted', { n: completionCount || 0 })}</span>
          </div>
          <div id="ladderSlot"></div>
        </div>
      `;
      document.getElementById('startLessonBtn').addEventListener('click', () => { window.location.href = 'roleplay.html'; });
      document.getElementById('startTranslateBtn').addEventListener('click', () => { window.location.href = 'translate.html'; });
      document.getElementById('startInputBtn').addEventListener('click', () => { window.location.href = 'input.html'; });
      document.getElementById('startReadingBtn').addEventListener('click', () => { window.location.href = 'reading.html'; });
      document.getElementById('startVocabBtn').addEventListener('click', () => { window.location.href = 'vocab.html'; });
      renderLadder(document.getElementById('ladderSlot'), {
        mode: 'display', current: profile.current_level, target: profile.target_level, compact: true, progress: 40,
      });
    }

    (async () => {
      user = await requireAuth();
      if (!user) return;

      profile = await getProfile(user.id);
      if (!profile || !profile.name) { window.location.href = 'onboarding.html'; return; }
      setLocale(profile.native_language);
      document.getElementById('loadingLabel').textContent = t('db.loading');
      document.getElementById('navHome').querySelector('span').textContent = t('nav.home');
      document.getElementById('navProgress').querySelector('span').textContent = t('nav.progress');
      document.getElementById('navTalk').querySelector('span').textContent = t('nav.talk');
      document.getElementById('navBasecamp').querySelector('span').textContent = t('nav.basecamp');
      document.getElementById('navSignoutLabel').textContent = t('nav.signout');

      // Landing on the dashboard always starts a fresh choice — any plan
      // left mid-way from a previous visit is intentionally abandoned here,
      // consistent with plans not being saved.
      clearActivePlan();

      const { count } = await db
        .from('lesson_completions').select('*', { count: 'exact', head: true }).eq('user_id', user.id);
      completionCount = count;
      vocabProgress = await getVocabProgress(user.id, profile.target_language, profile.current_level);
      const { data: myBadges } = await db.from('user_badges').select('badge_code').eq('user_id', user.id);
      myBadgeCodes = (myBadges || []).map(b => b.badge_code);

      renderHeader();
      renderFork();
      renderCoachCard(); // fire-and-forget — fills in coachSlot once it resolves

      // Best-effort: let them know if anyone cheered them on since they last
      // checked Basecamp. Doesn't mark cheers seen here — that happens when
      // they actually open Basecamp, so the banner is a lightweight nudge.
      try {
        const { count: cheerCount } = await db.from('cheers')
          .select('id', { count: 'exact', head: true }).eq('to_user_id', user.id).eq('seen', false);
        if (cheerCount) {
          document.getElementById('cheerBannerSlot').innerHTML = `
            <a class="card" href="basecamp.html" style="display:block;margin-bottom:14px;background:var(--mint-soft);border-color:var(--mint);text-decoration:none;color:var(--text);font-size:13px;">
              🤝 ${t('db.cheerBanner', { n: cheerCount })}
            </a>`;
        }
      } catch (e) {}

      const signOutBtn = document.getElementById('signOutBtn');
      if (DEV_MODE) {
        signOutBtn.disabled = true;
        signOutBtn.style.opacity = '.35';
        signOutBtn.title = t('nav.signoutLater');
      } else {
        signOutBtn.addEventListener('click', async () => {
          await db.auth.signOut();
          window.location.href = 'login.html';
        });
      }
    })();
  </script>
</body>
</html>
